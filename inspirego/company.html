<div class="module-container company-module" id="company-module">
<style>
.company-module{font-family:Inter,Poppins,Arial,sans-serif;color:#202124;box-sizing:border-box;padding:0 0 32px}
.company-module *{box-sizing:border-box}
.company-module .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;margin-bottom:18px}
.company-module .title h2{margin:0;font-size:22px;font-weight:700;color:#263746}
.company-module .title p{margin:5px 0 0;color:#7b8794;font-size:13px}
.company-module .actions{display:flex;gap:8px;flex-wrap:wrap}
.company-module button,.company-module input,.company-module select,.company-module textarea{font:inherit}
.company-module .btn{border:1px solid #d8dee5;background:#fff;color:#34495e;border-radius:9px;padding:10px 15px;min-height:42px;cursor:pointer}
.company-module .btn:hover{background:#f6f8fa}
.company-module .btn.primary{background:#173f63;color:#fff;border-color:#173f63}
.company-module .btn.primary:hover{background:#123451}
.company-module .btn.danger{color:#b42318;border-color:#f1b5ae}
.company-module .section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px}
.company-module .section h3{font-size:15px;margin:0 0 16px;color:#34495e}
.company-module .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.company-module .field{min-width:0}
.company-module .field.span2{grid-column:span 2}
.company-module .field.span3{grid-column:1/-1}
.company-module label{display:block;font-size:12px;font-weight:600;color:#566573;margin:0 0 6px}
.company-module .req{color:#c62828}
.company-module .form-input{width:100%;border:1px solid #d4dbe2;background:#fff;border-radius:9px;padding:11px 12px;min-height:42px;outline:none;color:#202124}
.company-module textarea.form-input{min-height:92px;resize:vertical}
.company-module .form-input:focus{border-color:#4b8fd1;box-shadow:0 0 0 3px rgba(75,143,209,.12)}
.company-module .meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}
.company-module .meta-card{background:#f7f9fb;border:1px solid #edf0f3;border-radius:9px;padding:10px 12px}
.company-module .meta-label{font-size:11px;color:#7a8793;margin-bottom:4px}
.company-module .meta-value{font-size:13px;font-weight:600;color:#34495e;word-break:break-word}
.company-module .status{display:none;padding:10px 12px;border-radius:9px;margin-bottom:14px;font-size:13px}
.company-module .status.show{display:block}
.company-module .status.ok{background:#ecfdf3;color:#067647;border:1px solid #abefc6}
.company-module .status.err{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
.company-module .footer-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
.company-module .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.company-module .toolbar-title{font-size:14px;font-weight:700;color:#34495e}
.company-module .file-input{display:none}
.company-module .readonly{background:#f7f9fb}
@media(max-width:800px){
 .company-module .topbar{align-items:flex-start;flex-direction:column;padding:16px}
 .company-module .actions{width:100%}
 .company-module .actions .btn{flex:1}
 .company-module .grid{grid-template-columns:1fr 1fr}
 .company-module .field.span2{grid-column:span 2}
 .company-module .meta{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
 .company-module{padding-bottom:90px}
 .company-module .topbar{border-radius:10px}
 .company-module .title h2{font-size:19px}
 .company-module .grid{grid-template-columns:1fr}
 .company-module .field.span2,.company-module .field.span3{grid-column:auto}
 .company-module .section{padding:14px;border-radius:11px}
 .company-module .meta{grid-template-columns:1fr}
 .company-module .actions .btn{flex:none}
 .company-module .footer-actions{display:grid;grid-template-columns:1fr 1fr}
}
</style>

<div class="topbar">
  <div class="title">
    <h2>Company Settings</h2>
    <p>Maintain the master company profile used across COREBIQ.</p>
  </div>
  <div class="actions">
    <button class="btn" type="button" onclick="window.companyRefresh()"><span class="material-symbols-rounded">refresh</span> Refresh</button>
    <button class="btn" type="button" onclick="window.companyExport()"><span class="material-symbols-rounded">download</span> Export</button>
    <button class="btn" type="button" onclick="document.getElementById('companyImportFile').click()"><span class="material-symbols-rounded">upload_file</span> Import</button>
    <button class="btn primary" type="button" onclick="window.companySave()"><span class="material-symbols-rounded">save</span> Save Company</button>
  </div>
</div>

<div id="companyStatus" class="status"></div>

<form id="companyForm" onsubmit="event.preventDefault();window.companySave()">
  <input type="hidden" id="companyDocId">

  <div class="section">
    <h3>Basic Information</h3>
    <div class="grid">
      <div class="field">
        <label>Legal Company Name <span class="req">*</span></label>
        <input id="legalName" class="form-input" required>
      </div>
      <div class="field">
        <label>Trade / Display Name</label>
        <input id="tradeName" class="form-input">
      </div>
      <div class="field">
        <label>Business Type</label>
        <select id="businessType" class="form-input">
          <option value="">Select</option>
          <option>Proprietorship</option>
          <option>Partnership</option>
          <option>LLP</option>
          <option>Private Limited Company</option>
          <option>Public Limited Company</option>
          <option>One Person Company</option>
          <option>Trust</option>
          <option>Society</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field"><label>PAN</label><input id="pan" class="form-input" maxlength="10" style="text-transform:uppercase"></div>
      <div class="field"><label>GSTIN</label><input id="gstin" class="form-input" maxlength="15" style="text-transform:uppercase"></div>
      <div class="field"><label>CIN / LLPIN / Registration No.</label><input id="registrationNo" class="form-input"></div>
    </div>
  </div>

  <div class="section">
    <h3>Contact Information</h3>
    <div class="grid">
      <div class="field"><label>Primary Phone</label><input id="phone" class="form-input" type="tel"></div>
      <div class="field"><label>WhatsApp</label><input id="whatsapp" class="form-input" type="tel"></div>
      <div class="field"><label>Email</label><input id="email" class="form-input" type="email"></div>
      <div class="field"><label>Website</label><input id="website" class="form-input" type="url" placeholder="https://"></div>
    </div>
  </div>

  <div class="section">
    <h3>Registered Address</h3>
    <div class="grid">
      <div class="field span3"><label>Address</label><textarea id="address" class="form-input"></textarea></div>
      <div class="field"><label>City</label><input id="city" class="form-input"></div>
      <div class="field"><label>State</label><input id="state" class="form-input"></div>
      <div class="field"><label>PIN Code</label><input id="pinCode" class="form-input" inputmode="numeric"></div>
      <div class="field"><label>Country</label><input id="country" class="form-input" value="India"></div>
    </div>
  </div>

  <div class="section">
    <h3>Business Defaults</h3>
    <div class="grid">
      <div class="field">
        <label>Currency</label>
        <select id="currency" class="form-input">
          <option value="INR">INR – Indian Rupee</option>
          <option value="AED">AED – UAE Dirham</option>
          <option value="USD">USD – US Dollar</option>
          <option value="EUR">EUR – Euro</option>
          <option value="GBP">GBP – Pound Sterling</option>
        </select>
      </div>
      <div class="field"><label>Invoice Prefix</label><input id="invoicePrefix" class="form-input" value="INV"></div>
      <div class="field"><label>Financial Year Start</label><input id="fyStart" class="form-input" value="01-04" placeholder="DD-MM"></div>
      <div class="field span3"><label>Notes</label><textarea id="notes" class="form-input"></textarea></div>
    </div>
  </div>

  <div class="section">
    <h3>Record Information</h3>
    <div class="meta">
      <div class="meta-card"><div class="meta-label">Form ID</div><div class="meta-value" id="metaFormId">COM-00001</div></div>
      <div class="meta-card"><div class="meta-label">Created At</div><div class="meta-value" id="metaCreatedAt">—</div></div>
      <div class="meta-card"><div class="meta-label">Updated At</div><div class="meta-value" id="metaUpdatedAt">—</div></div>
      <div class="meta-card"><div class="meta-label">Created By</div><div class="meta-value" id="metaCreatedBy">—</div></div>
    </div>
    <div class="footer-actions">
      <button class="btn" type="button" onclick="window.companyReset()">Reset</button>
      <button class="btn primary" type="submit" id="companySaveBtn">Save Company</button>
    </div>
  </div>
</form>

<input id="companyImportFile" class="file-input" type="file" accept=".json,application/json">

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

(function(){
  const root=document.getElementById('company-module');
  if(!root || root.dataset.initialized==='1') return;
  root.dataset.initialized='1';

  const fields=[
    'legalName','tradeName','businessType','pan','gstin','registrationNo',
    'phone','whatsapp','email','website','address','city','state','pinCode',
    'country','currency','invoicePrefix','fyStart','notes'
  ];

  let currentUser=null;
  let originalData=null;

  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const fmtDate=v=>{
    if(!v)return '—';
    let d;
    if(v?.toDate)d=v.toDate();
    else if(v instanceof Date)d=v;
    else {d=new Date(v);if(Number.isNaN(d.getTime()))return String(v)}
    const dd=String(d.getDate()).padStart(2,'0');
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const yy=d.getFullYear();
    const hh=String(d.getHours()).padStart(2,'0');
    const mi=String(d.getMinutes()).padStart(2,'0');
    return `${dd}-${mm}-${yy} ${hh}:${mi}`;
  };

  function showStatus(msg,type='ok'){
    const e=$('companyStatus');
    e.textContent=msg;
    e.className='status show '+type;
    clearTimeout(showStatus.timer);
    showStatus.timer=setTimeout(()=>e.classList.remove('show'),5000);
  }

  function userName(){
    return currentUser?.displayName || currentUser?.email || currentUser?.uid || 'Unknown';
  }

  function readForm(){
    const data={};
    fields.forEach(id=>data[id]=$(id)?.value?.trim?.() ?? '');
    data.legalName=data.legalName.trim();
    data.pan=data.pan.toUpperCase();
    data.gstin=data.gstin.toUpperCase();
    data.invoicePrefix=(data.invoicePrefix||'INV').toUpperCase();
    return data;
  }

  function writeForm(data={}){
    fields.forEach(id=>{
      const e=$(id);
      if(e)e.value=data[id]??'';
    });
    if(!$('country').value)$('country').value='India';
    if(!$('currency').value)$('currency').value='INR';
    if(!$('invoicePrefix').value)$('invoicePrefix').value='INV';
    if(!$('fyStart').value)$('fyStart').value='01-04';

    $('metaFormId').textContent=data.formId||'COM-00001';
    $('metaCreatedAt').textContent=fmtDate(data.createdAt);
    $('metaUpdatedAt').textContent=fmtDate(data.updatedAt);
    $('metaCreatedBy').textContent=data.createdByName || data.createdBy || '—';
  }

  window.companyReset=()=>{
    if(originalData) writeForm(originalData);
    else writeForm({formId:'COM-00001',country:'India',currency:'INR',invoicePrefix:'INV',fyStart:'01-04'});
    showStatus('Form reset.');
  };

  window.companyRefresh=async()=>{
    await loadCompany(true);
  };

  window.companySave=async()=>{
    if(!currentUser)return showStatus('Please log in before saving the company profile.','err');
    const data=readForm();
    if(!data.legalName)return showStatus('Legal Company Name is required.','err');

    const btn=$('companySaveBtn');
    btn.disabled=true;
    btn.textContent='Saving...';

    try{
      const ref=doc(db,'settings','company');
      const snap=await getDoc(ref);
      const existing=snap.exists()?snap.data():{};
      const formId=existing.formId||'COM-00001';

      const payload={
        ...data,
        formId,
        createdAt:existing.createdAt || serverTimestamp(),
        createdBy:existing.createdBy || currentUser.uid,
        createdByName:existing.createdByName || userName(),
        updatedAt:serverTimestamp(),
        updatedBy:currentUser.uid,
        updatedByName:userName()
      };

      await setDoc(ref,payload,{merge:true});
      const fresh=await getDoc(ref);
      originalData=fresh.exists()?fresh.data():payload;
      writeForm(originalData);
      showStatus('Company details saved successfully.');
    }catch(err){
      console.error(err);
      showStatus('Failed to save company details: '+(err.message||'Firestore error'),'err');
    }finally{
      btn.disabled=false;
      btn.textContent='Save Company';
    }
  };

  window.companyExport=async()=>{
    try{
      const snap=await getDoc(doc(db,'settings','company'));
      if(!snap.exists())return showStatus('No company data available to export.','err');
      const data=snap.data();
      const blob=new Blob([JSON.stringify(data,(k,v)=>{
        if(v?.seconds!==undefined && v?.nanoseconds!==undefined)return new Date(v.seconds*1000).toISOString();
        return v;
      },2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`company-${data.formId||'COM-00001'}.json`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }catch(err){
      console.error(err);
      showStatus('Export failed.','err');
    }
  };

  $('companyImportFile').addEventListener('change',async e=>{
    const file=e.target.files?.[0];
    if(!file)return;
    try{
      const parsed=JSON.parse(await file.text());
      writeForm({...parsed,formId:parsed.formId||'COM-00001'});
      showStatus('Company data loaded into the form. Click Save Company to store it in Firebase.');
    }catch(err){
      showStatus('Invalid JSON company file.','err');
    }finally{
      e.target.value='';
    }
  });

  async function loadCompany(showMessage=false){
    try{
      const snap=await getDoc(doc(db,'settings','company'));
      if(snap.exists()){
        originalData=snap.data();
        writeForm(originalData);
        if(showMessage)showStatus('Company details refreshed.');
      }else{
        originalData={formId:'COM-00001',country:'India',currency:'INR',invoicePrefix:'INV',fyStart:'01-04'};
        writeForm(originalData);
        if(showMessage)showStatus('No company profile found. Create one and save it.');
      }
    }catch(err){
      console.error(err);
      showStatus('Unable to load company profile: '+(err.message||'Firestore error'),'err');
    }
  }

  onAuthStateChanged(auth,async user=>{
    currentUser=user;
    if(!user){
      root.innerHTML='<div style="padding:24px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;color:#b42318">Access denied. Please log in.</div>';
      return;
    }
    await loadCompany(false);
  });
})();
</script>
</div>
