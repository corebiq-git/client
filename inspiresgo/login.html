<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4b8fd1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>COREBIQ | Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">

<style>
:root{
  --bg:#f5f9fe;
  --surface:#ffffff;
  --text:#17202b;
  --text-soft:#46515e;
  --muted:#687484;
  --border:#dbe5ef;
  --primary:#4b8fd1;
  --primary-dark:#3476b5;
  --primary-light:#d9edff;
  --primary-pale:#edf7ff;
  --shadow:0 8px 28px rgba(45,72,101,.08),0 20px 55px rgba(45,72,101,.055);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Poppins",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%,rgba(75,143,209,.11),transparent 30%),
    radial-gradient(circle at 86% 80%,rgba(75,143,209,.08),transparent 32%),
    var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.page{
  width:min(470px,100%);
  text-align:center;
}

.brand-mark{
  width:58px;
  height:58px;
  margin:0 auto 22px;
  display:grid;
  place-items:center;
  border:1px solid #cfe3f5;
  border-radius:16px;
  background:#e7f3ff;
  box-shadow:0 5px 18px rgba(45,72,101,.06);
  overflow:hidden;
}

.brand-mark img{
  width:100%;
  height:100%;
  padding:8px;
  object-fit:contain;
}

.brand-fallback{
  display:none;
  font-size:21px;
  font-weight:700;
  letter-spacing:-1.5px;
  color:var(--primary-dark);
}

.card{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.94);
  border:1px solid var(--border);
  border-radius:22px;
  padding:36px 34px 32px;
  box-shadow:var(--shadow);
  text-align:left;
}

.card:before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border:1px solid rgba(75,143,209,.13);
  border-radius:50%;
  top:-150px;
  right:-90px;
  box-shadow:
    0 0 0 25px rgba(75,143,209,.035),
    0 0 0 52px rgba(75,143,209,.025);
}

.card-content{
  position:relative;
  z-index:1;
}

.kicker{
  font-size:10px;
  line-height:1;
  font-weight:700;
  letter-spacing:.12em;
  color:var(--primary-dark);
  margin-bottom:9px;
}

h1{
  font-size:27px;
  line-height:1.25;
  font-weight:600;
  letter-spacing:-.4px;
  color:var(--text);
  margin-bottom:7px;
}

.subtitle{
  font-size:12px;
  line-height:1.7;
  color:var(--text-soft);
  margin-bottom:24px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:600;
  color:var(--text-soft);
  margin-bottom:6px;
}

.input-wrap{
  position:relative;
}

.input-wrap .material-symbols-rounded{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  font-size:19px;
  color:#7590a8;
  pointer-events:none;
}

input{
  width:100%;
  height:46px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
  background:#fbfdff;
  color:var(--text);
  padding:0 13px 0 42px;
  font-size:12px;
  transition:.18s ease;
}

input:focus{
  border-color:#9fc7e8;
  background:#fff;
  box-shadow:0 0 0 3px rgba(75,143,209,.10);
}

.password-toggle{
  position:absolute;
  right:7px;
  top:5px;
  width:36px;
  height:36px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#75879a;
  display:grid;
  place-items:center;
}

.password-toggle .material-symbols-rounded{
  position:static;
  transform:none;
}

.options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:3px 0 18px;
  gap:10px;
}

.remember{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:10px;
  color:var(--muted);
}

.remember input{
  width:14px;
  height:14px;
  padding:0;
  accent-color:var(--primary);
}

.forgot{
  border:0;
  background:transparent;
  color:var(--primary-dark);
  font-size:10px;
  font-weight:600;
  cursor:pointer;
}

.primary-btn{
  width:100%;
  height:46px;
  border:1px solid var(--primary);
  border-radius:11px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:12px;
  font-weight:600;
  box-shadow:0 6px 16px rgba(75,143,209,.22);
  cursor:pointer;
  transition:.18s ease;
}

.primary-btn:hover{
  background:var(--primary-dark);
  border-color:var(--primary-dark);
  transform:translateY(-1px);
}

.primary-btn:disabled{
  opacity:.65;
  cursor:wait;
  transform:none;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:20px 0 16px;
  color:#8997a5;
  font-size:9px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:#e4ebf2;
  flex:1;
}

.google-btn{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  color:var(--text-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
}

.google-icon{
  width:18px;
  height:18px;
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:15px;
}

.message{
  display:none;
  margin-top:13px;
  padding:10px 11px;
  border:1px solid #dbe5ef;
  border-radius:9px;
  background:#f7fbff;
  color:var(--text-soft);
  font-size:10px;
  line-height:1.5;
}

.message.show{
  display:block;
}

.message.error{
  border-color:#f1cccc;
  background:#fff6f6;
  color:#a33a3a;
}

.message.success{
  border-color:#c8e7dc;
  background:#f3fcf8;
  color:#24765b;
}

.signup{
  text-align:center;
  margin-top:19px;
  font-size:10px;
  color:var(--muted);
}

.signup a{
  color:var(--primary-dark);
  font-weight:600;
  text-decoration:none;
}

.footer{
  margin-top:16px;
  color:var(--muted);
  font-size:9px;
  text-align:center;
}

.material-symbols-rounded{
  font-size:19px;
  vertical-align:middle;
}

@media(max-width:520px){
  body{padding:16px;}
  .card{
    padding:30px 21px 27px;
    border-radius:18px;
  }
  h1{font-size:23px;}
  .subtitle{font-size:11px;}
}

@media(max-width:360px){
  .card{padding:27px 17px 24px;}
  h1{font-size:21px;}
}
</style>
</head>

<body>

<main class="page">

  <div class="brand-mark">
    <img src="assets/logo.png" alt="COREBIQ"
         onerror="this.style.display='none';document.getElementById('brand-fallback').style.display='block';">
    <span id="brand-fallback" class="brand-fallback">BIQ</span>
  </div>

  <section class="card">
    <div class="card-content">

      <div class="kicker">COREBIQ WORK FLOW</div>

      <h1>Welcome back</h1>

      <p class="subtitle">
        Sign in to continue to your business management workspace.
      </p>

      <form id="login-form">

        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <span class="material-symbols-rounded">mail</span>
            <input id="email" type="email" autocomplete="email"
                   placeholder="Enter your email" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="material-symbols-rounded">lock</span>
            <input id="password" type="password"
                   autocomplete="current-password"
                   placeholder="Enter your password" required>
            <button class="password-toggle" type="button"
                    id="toggle-password" aria-label="Show password">
              <span class="material-symbols-rounded">visibility</span>
            </button>
          </div>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember">
            <span>Remember me</span>
          </label>

          <button class="forgot" type="button" id="forgot-password">
            Forgot password?
          </button>
        </div>

        <button class="primary-btn" id="login-btn" type="submit">
          <span class="material-symbols-rounded">login</span>
          Sign In
        </button>

      </form>

      <div class="divider"><span>OR</span></div>

      <button class="google-btn" id="google-btn" type="button">
        <span class="google-icon">G</span>
        Continue with Google
      </button>

      <div id="login-message" class="message"></div>

      <div class="signup">
        Don't have an account?
        <a href="signup.html">Create account</a>
      </div>

    </div>
  </section>

  <div class="footer">COREBIQ • Intelligent Business Workflow</div>

</main>

<script type="module">
import { auth } from './firebase-config.js';
import {
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

const form = document.getElementById('login-form');
const email = document.getElementById('email');
const password = document.getElementById('password');
const loginBtn = document.getElementById('login-btn');
const googleBtn = document.getElementById('google-btn');
const forgotBtn = document.getElementById('forgot-password');
const toggleBtn = document.getElementById('toggle-password');
const message = document.getElementById('login-message');

function showMessage(text, type=''){
  message.textContent = text;
  message.className = 'message show ' + type;
}

function friendlyError(error){
  const code = error?.code || '';
  const map = {
    'auth/invalid-credential':'Invalid email or password.',
    'auth/invalid-login-credentials':'Invalid email or password.',
    'auth/user-not-found':'No account was found with this email.',
    'auth/wrong-password':'Invalid email or password.',
    'auth/too-many-requests':'Too many attempts. Please try again later.',
    'auth/popup-closed-by-user':'Google sign-in was cancelled.',
    'auth/popup-blocked':'The Google sign-in popup was blocked by the browser.'
  };
  return map[code] || error?.message || 'Unable to sign in. Please try again.';
}

toggleBtn.addEventListener('click',()=>{
  const isPassword = password.type === 'password';
  password.type = isPassword ? 'text' : 'password';
  toggleBtn.querySelector('.material-symbols-rounded').textContent =
    isPassword ? 'visibility_off' : 'visibility';
});

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  showMessage('');
  loginBtn.disabled = true;
  loginBtn.innerHTML =
    '<span class="material-symbols-rounded">progress_activity</span> Signing in...';

  try{
    await signInWithEmailAndPassword(auth, email.value.trim(), password.value);
    window.location.href = 'index.html';
  }catch(error){
    showMessage(friendlyError(error),'error');
  }finally{
    loginBtn.disabled = false;
    loginBtn.innerHTML =
      '<span class="material-symbols-rounded">login</span> Sign In';
  }
});

googleBtn.addEventListener('click', async ()=>{
  showMessage('');
  googleBtn.disabled = true;
  googleBtn.textContent = 'Signing in...';

  try{
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
    window.location.href = 'index.html';
  }catch(error){
    showMessage(friendlyError(error),'error');
  }finally{
    googleBtn.disabled = false;
    googleBtn.innerHTML = '<span class="google-icon">G</span> Continue with Google';
  }
});

forgotBtn.addEventListener('click', async ()=>{
  const value = email.value.trim();
  if(!value){
    showMessage('Enter your email address first.','error');
    email.focus();
    return;
  }

  try{
    await sendPasswordResetEmail(auth, value);
    showMessage('Password reset instructions have been sent to your email.','success');
  }catch(error){
    showMessage(friendlyError(error),'error');
  }
});
</script>

</body>
</html>
