<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COREBIQ Calc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Hide scrollbar for display */
        ::-webkit-scrollbar { display: none; }
        
        /* Prevent double-tap zoom on mobile */
        button { touch-action: manipulation; }
        
        /* Dynamic Viewport Height for perfect mobile fit */
        .h-dvh { height: 100dvh; }
    </style>
</head>
<body class="bg-gray-200 dark:bg-gray-950 flex items-center justify-center min-h-screen sm:p-6 transition-colors duration-300 m-0">

    <!-- App Container: Full screen on mobile, constrained on desktop -->
    <div class="w-full h-dvh sm:h-auto sm:min-h-[720px] sm:max-w-[400px] bg-slate-50 dark:bg-[#0f172a] sm:rounded-[2.5rem] shadow-none sm:shadow-2xl flex flex-col relative overflow-hidden transition-colors duration-300 border-0 sm:border border-gray-200 dark:border-slate-800">
        
        <!-- Header -->
        <div class="flex justify-between items-center px-6 pt-8 pb-4 relative z-10 shrink-0">
            <div class="flex items-center gap-2">
                <svg class="w-7 h-7 text-blue-600 dark:text-blue-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span class="text-slate-900 dark:text-white font-bold text-xl tracking-widest transition-colors">
                    COREBIQ <span class="text-blue-600 dark:text-blue-500 font-light">Calc</span>
                </span>
            </div>
            
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="p-2 rounded-full bg-gray-200 dark:bg-slate-800 text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-slate-700 transition-colors">
                <!-- Sun Icon (shows in dark mode) -->
                <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <!-- Moon Icon (shows in light mode) -->
                <svg id="icon-moon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
        </div>

        <!-- Display Screen -->
        <div class="flex-1 flex flex-col justify-end px-6 pb-6 pt-4 text-right">
            <div id="previous-operand" class="text-slate-500 dark:text-slate-400 text-base h-6 mb-2 font-medium tracking-wider flex justify-end items-center transition-colors"></div>
            <div id="current-operand" class="text-slate-900 dark:text-white text-6xl sm:text-5xl font-semibold overflow-x-auto whitespace-nowrap tracking-tight transition-colors">0</div>
        </div>

        <!-- Keypad Area: Fills remaining space, styled like the image -->
        <div class="bg-gray-100 dark:bg-[#151e32] p-6 pb-10 sm:pb-6 rounded-t-[2rem] sm:rounded-[2rem] sm:mx-2 sm:mb-2 transition-colors duration-300">
            <div class="grid grid-cols-4 gap-3 sm:gap-4 h-full">
                <!-- Row 1 -->
                <button onclick="calculator.clear()" class="col-span-2 bg-red-500/10 dark:bg-slate-700/50 text-red-600 dark:text-red-400 hover:bg-red-500 hover:text-white transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-semibold text-lg active:scale-95">AC</button>
                <button onclick="calculator.delete()" class="bg-white dark:bg-slate-700/50 text-slate-700 dark:text-slate-300 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-600 border border-gray-200 dark:border-transparent transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-semibold text-lg active:scale-95">DEL</button>
                <button onclick="calculator.chooseOperation('÷')" class="bg-blue-600 text-white hover:bg-blue-500 shadow-md shadow-blue-600/20 transition-all duration-200 rounded-2xl py-4 sm:py-5 font-semibold text-2xl active:scale-95">÷</button>
                
                <!-- Row 2 -->
                <button onclick="calculator.appendNumber('7')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">7</button>
                <button onclick="calculator.appendNumber('8')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">8</button>
                <button onclick="calculator.appendNumber('9')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">9</button>
                <button onclick="calculator.chooseOperation('×')" class="bg-blue-600 text-white hover:bg-blue-500 shadow-md shadow-blue-600/20 transition-all duration-200 rounded-2xl py-4 sm:py-5 font-semibold text-2xl active:scale-95">×</button>
                
                <!-- Row 3 -->
                <button onclick="calculator.appendNumber('4')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">4</button>
                <button onclick="calculator.appendNumber('5')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">5</button>
                <button onclick="calculator.appendNumber('6')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">6</button>
                <button onclick="calculator.chooseOperation('-')" class="bg-blue-600 text-white hover:bg-blue-500 shadow-md shadow-blue-600/20 transition-all duration-200 rounded-2xl py-4 sm:py-5 font-semibold text-2xl active:scale-95">−</button>
                
                <!-- Row 4 -->
                <button onclick="calculator.appendNumber('1')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">1</button>
                <button onclick="calculator.appendNumber('2')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">2</button>
                <button onclick="calculator.appendNumber('3')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">3</button>
                <button onclick="calculator.chooseOperation('+')" class="bg-blue-600 text-white hover:bg-blue-500 shadow-md shadow-blue-600/20 transition-all duration-200 rounded-2xl py-4 sm:py-5 font-semibold text-2xl active:scale-95">+</button>
                
                <!-- Row 5 -->
                <button onclick="calculator.appendNumber('0')" class="col-span-2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">0</button>
                <button onclick="calculator.appendNumber('.')" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-sm dark:shadow-none hover:bg-gray-50 dark:hover:bg-slate-700 border border-gray-200 dark:border-slate-700/30 transition-colors duration-200 rounded-2xl py-4 sm:py-5 font-medium text-2xl active:scale-95">.</button>
                <button onclick="calculator.compute()" class="bg-blue-500 text-white hover:bg-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.5)] transition-all duration-200 rounded-2xl py-4 sm:py-5 font-semibold text-3xl active:scale-95">=</button>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // Theme Toggle Logic
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        // Calculator Logic
        class Calculator {
            constructor(previousOperandTextElement, currentOperandTextElement) {
                this.previousOperandTextElement = previousOperandTextElement;
                this.currentOperandTextElement = currentOperandTextElement;
                this.clear();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.updateDisplay();
            }

            delete() {
                if (this.currentOperand === '0') return;
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
                if (this.currentOperand === '') this.currentOperand = '0';
                this.updateDisplay();
            }

            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else {
                    if(this.currentOperand.length < 15) {
                        this.currentOperand = this.currentOperand.toString() + number.toString();
                    }
                }
                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '0' && this.previousOperand === '' && operation !== '-') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '0';
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                
                if (isNaN(prev) || isNaN(current)) return;
                
                switch (this.operation) {
                    case '+': computation = prev + current; break;
                    case '-': computation = prev - current; break;
                    case '×': computation = prev * current; break;
                    case '÷':
                        if (current === 0) {
                            alert("Cannot divide by zero");
                            this.clear();
                            return;
                        }
                        computation = prev / current;
                        break;
                    default: return;
                }
                
                this.currentOperand = Math.round(computation * 10000000000) / 10000000000;
                this.operation = undefined;
                this.previousOperand = '';
                this.updateDisplay();
            }

            getDisplayNumber(number) {
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                let integerDisplay;
                
                if (isNaN(integerDigits)) {
                    integerDisplay = '0';
                } else {
                    integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
                }
                
                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            updateDisplay() {
                this.currentOperandTextElement.innerText = this.getDisplayNumber(this.currentOperand);
                if (this.operation != null) {
                    this.previousOperandTextElement.innerText = `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandTextElement.innerText = '';
                }
            }
        }

        const previousOperandTextElement = document.getElementById('previous-operand');
        const currentOperandTextElement = document.getElementById('current-operand');
        const calculator = new Calculator(previousOperandTextElement, currentOperandTextElement);
        
        document.addEventListener('keydown', e => {
            if (e.key >= 0 && e.key <= 9 || e.key === '.') calculator.appendNumber(e.key);
            if (e.key === '=' || e.key === 'Enter') calculator.compute();
            if (e.key === 'Backspace') calculator.delete();
            if (e.key === 'Escape') calculator.clear();
            if (e.key === '+') calculator.chooseOperation('+');
            if (e.key === '-') calculator.chooseOperation('-');
            if (e.key === '*') calculator.chooseOperation('×');
            if (e.key === '/') calculator.chooseOperation('÷');
        });
    </script>
</body>
</html>
