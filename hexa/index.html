<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="description" content="The Intelligent Workflow for Business. Reusable ERP, CRM, and Business Operations Platform." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="COREBIQ" />
  <title>COREBIQ</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>html,body,#root{min-height:100%;margin:0}body{min-height:100vh}</style>
</head>
<body class="bg-[#f8f9fa] text-[#1f1f1f] font-sans antialiased selection:bg-blue-100 selection:text-blue-900">
  <div id="root"></div>
  <script src="./loader.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.warn('COREBIQ PWA registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
