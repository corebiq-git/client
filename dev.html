<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#F7F8FC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>COREBIQ</title>

<!-- =========================================================
     COREBIQ
     Single-file Development App
     Firebase + Material 3 / Gemini-inspired UI
     ========================================================= -->

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">


<style>

/* =========================================================
   COREBIQ DESIGN SYSTEM
   Gemini / Material 3 inspired
   ========================================================= */

:root {

    --primary: #356AE6;
    --primary-container: #DCE6FF;
    --on-primary: #FFFFFF;

    --surface: #F7F8FC;
    --surface-container: #FFFFFF;
    --surface-container-low: #F1F3F8;
    --surface-container-high: #E9ECF3;

    --on-surface: #1A1B20;
    --on-surface-variant: #5F636D;

    --outline: #D7DAE2;
    --outline-strong: #B9BDC7;

    --success: #188038;
    --warning: #B06000;
    --danger: #C5221F;

    --radius-xs: 10px;
    --radius-sm: 14px;
    --radius-md: 20px;
    --radius-lg: 28px;
    --radius-xl: 34px;

    --header-height: 70px;
    --bottom-height: 78px;

    --shadow-soft:
        0 1px 2px rgba(20,24,35,.05),
        0 8px 28px rgba(20,24,35,.06);

    --font: "Google Sans", "Google Sans Text", Arial, sans-serif;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: var(--font);
    background: var(--surface);
    color: var(--on-surface);
}

body {
    overflow-x: hidden;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================================
   APP
   ========================================================= */

#app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
   ========================================================= */

.app-header {

    height: var(--header-height);

    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    display: flex;
    align-items: center;

    padding:
        0 max(18px, env(safe-area-inset-left))
        0 max(18px, env(safe-area-inset-right));

    background: rgba(247,248,252,.88);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(215,218,226,.65);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;

    min-width: 0;
}

.brand-logo {
    height: 32px;
    width: auto;

    max-width: 145px;

    object-fit: contain;
}

.header-title {
    display: none;

    font-size: 20px;
    font-weight: 600;
    letter-spacing: -.3px;
}

.header-spacer {
    flex: 1;
}

.header-action {

    width: 44px;
    height: 44px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    color: var(--on-surface);
    background: transparent;
}

.header-action:active {
    background: var(--surface-container-high);
}

.header-user {

    width: 38px;
    height: 38px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background: var(--primary-container);
    color: var(--primary);

    font-weight: 600;
}


/* =========================================================
   MAIN
   ========================================================= */

.app-main {

    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    padding:
        calc(var(--header-height) + 18px)
        16px
        calc(var(--bottom-height) + 26px);

    flex: 1;
}


/* =========================================================
   MODULE CONTAINER
   ========================================================= */

.module-container {

    width: 100%;
    min-height: calc(100dvh - 130px);

    animation: moduleIn .22s ease;
}

@keyframes moduleIn {

    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   PAGE HEADER
   ========================================================= */

.page-heading {

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 16px;

    margin-bottom: 20px;
}

.page-heading h1 {

    margin: 0;

    font-size: clamp(26px, 7vw, 34px);

    line-height: 1.1;

    letter-spacing: -.8px;

    font-weight: 600;
}

.page-heading p {

    margin: 6px 0 0;

    font-size: 14px;

    color: var(--on-surface-variant);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-box {

    display: flex;
    align-items: center;

    width: 100%;

    min-height: 54px;

    padding: 0 16px;

    gap: 10px;

    background: var(--surface-container);

    border: 1px solid var(--outline);

    border-radius: 28px;

    margin-bottom: 18px;
}

.search-box .material-symbols-rounded {

    color: var(--on-surface-variant);
}

.search-box input {

    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;

    font-size: 16px;

    color: var(--on-surface);
}

.search-box input::placeholder {
    color: var(--on-surface-variant);
}


/* =========================================================
   GRID
   ========================================================= */

.card-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}

@media (min-width: 700px) {

    .card-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }
}

@media (min-width: 1000px) {

    .card-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }
}


/* =========================================================
   MATERIAL CARD
   ========================================================= */

.material-card {

    background: var(--surface-container);

    border: 1px solid rgba(215,218,226,.7);

    border-radius: var(--radius-md);

    padding: 18px;

    box-shadow: var(--shadow-soft);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.material-card:active {
    transform: scale(.985);
}

.card-icon {

    width: 46px;
    height: 46px;

    display: grid;
    place-items: center;

    border-radius: 15px;

    background: var(--primary-container);

    color: var(--primary);

    margin-bottom: 15px;
}

.card-icon .material-symbols-rounded {
    font-size: 24px;
}

.material-card h3 {

    margin: 0;

    font-size: 17px;

    font-weight: 600;
}

.material-card p {

    margin: 5px 0 0;

    font-size: 13px;

    line-height: 1.4;

    color: var(--on-surface-variant);
}


/* =========================================================
   STAT CARD
   ========================================================= */

.stats-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;

    margin-bottom: 18px;
}

.stat-card {

    background: var(--surface-container);

    border-radius: var(--radius-md);

    padding: 18px;

    border: 1px solid rgba(215,218,226,.7);
}

.stat-label {

    font-size: 13px;

    color: var(--on-surface-variant);

    margin-bottom: 7px;
}

.stat-value {

    font-size: 27px;

    line-height: 1;

    font-weight: 600;

    letter-spacing: -.5px;
}


/* =========================================================
   LIST
   ========================================================= */

.list {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.list-item {

    display: flex;

    align-items: center;

    gap: 13px;

    padding: 14px;

    background: var(--surface-container);

    border: 1px solid rgba(215,218,226,.65);

    border-radius: var(--radius-md);
}

.avatar {

    width: 44px;
    height: 44px;

    flex: 0 0 44px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: var(--primary-container);

    color: var(--primary);

    font-weight: 600;
}

.list-content {

    min-width: 0;

    flex: 1;
}

.list-title {

    font-size: 15px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.list-subtitle {

    margin-top: 3px;

    font-size: 13px;

    color: var(--on-surface-variant);
}

.list-action {

    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: transparent;

    color: var(--on-surface-variant);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.btn {

    min-height: 44px;

    padding: 0 18px;

    border-radius: 22px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    font-size: 14px;

    font-weight: 600;
}

.btn-primary {

    color: white;

    background: var(--primary);
}

.btn-tonal {

    color: var(--primary);

    background: var(--primary-container);
}

.btn-outline {

    background: transparent;

    color: var(--on-surface);

    border: 1px solid var(--outline);
}


/* =========================================================
   FAB
   ========================================================= */

.fab {

    position: fixed;

    right: 20px;

    bottom:
        calc(var(--bottom-height) + 20px);

    width: 58px;
    height: 58px;

    z-index: 110;

    border-radius: 18px;

    display: grid;
    place-items: center;

    color: var(--on-primary);

    background: var(--primary);

    box-shadow:
        0 5px 18px rgba(53,106,230,.28);
}

.fab .material-symbols-rounded {
    font-size: 27px;
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 100;

    height:
        calc(var(--bottom-height) + env(safe-area-inset-bottom));

    padding-bottom: env(safe-area-inset-bottom);

    display: flex;

    align-items: flex-start;

    background: rgba(247,248,252,.94);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border-top: 1px solid rgba(215,218,226,.7);
}

.bottom-inner {

    width: 100%;
    max-width: 600px;

    height: var(--bottom-height);

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    align-items: center;

    padding: 4px 8px;
}

.nav-item {

    height: 62px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 3px;

    color: var(--on-surface-variant);

    background: transparent;

    border-radius: 20px;

    font-size: 11px;

    font-weight: 500;
}

.nav-item .material-symbols-rounded {

    font-size: 24px;

    font-variation-settings:
        'FILL' 0,
        'wght' 450,
        'GRAD' 0,
        'opsz' 24;
}

.nav-item.active {

    color: var(--primary);
}

.nav-item.active .nav-icon-wrap {

    background: var(--primary-container);

    border-radius: 18px;

    padding: 2px 15px;
}

.nav-icon-wrap {

    min-height: 28px;

    display: flex;
    align-items: center;
}


/* =========================================================
   SECTION
   ========================================================= */

.section {

    margin-top: 24px;
}

.section-header {

    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 12px;
}

.section-header h2 {

    margin: 0;

    font-size: 19px;

    font-weight: 600;

    letter-spacing: -.2px;
}


/* =========================================================
   EMPTY STATE
   ========================================================= */

.empty-state {

    min-height: 260px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;
}

.empty-icon {

    width: 68px;
    height: 68px;

    border-radius: 22px;

    display: grid;
    place-items: center;

    background: var(--surface-container-high);

    color: var(--on-surface-variant);

    margin-bottom: 14px;
}

.empty-state h3 {

    margin: 0;

    font-size: 18px;
}

.empty-state p {

    max-width: 300px;

    margin: 7px 0 18px;

    font-size: 14px;

    line-height: 1.5;

    color: var(--on-surface-variant);
}


/* =========================================================
   FORM
   ========================================================= */

.form-card {

    background: var(--surface-container);

    border: 1px solid var(--outline);

    border-radius: var(--radius-lg);

    padding: 18px;
}

.form-group {

    margin-bottom: 16px;
}

.form-label {

    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 600;

    color: var(--on-surface-variant);
}

.form-control {

    width: 100%;

    min-height: 52px;

    padding: 0 15px;

    border-radius: 15px;

    border: 1px solid var(--outline);

    background: var(--surface-container);

    color: var(--on-surface);

    outline: none;
}

textarea.form-control {

    padding-top: 14px;

    min-height: 110px;

    resize: vertical;
}

.form-control:focus {

    border-color: var(--primary);

    box-shadow:
        0 0 0 3px rgba(53,106,230,.12);
}


/* =========================================================
   LOGIN
   ========================================================= */

#login-screen {

    min-height: 100dvh;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 24px;
}

.login-card {

    width: 100%;

    max-width: 420px;

    background: var(--surface-container);

    border: 1px solid var(--outline);

    border-radius: 30px;

    padding: 30px;

    box-shadow: var(--shadow-soft);

    text-align: center;
}

.login-logo {

    width: 180px;

    max-width: 75%;

    margin-bottom: 25px;
}

.login-card h1 {

    margin: 0;

    font-size: 27px;

    letter-spacing: -.6px;
}

.login-card p {

    color: var(--on-surface-variant);

    font-size: 14px;

    line-height: 1.5;

    margin: 8px 0 25px;
}

.google-login {

    width: 100%;

    min-height: 52px;

    border-radius: 26px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    background: var(--surface-container);

    border: 1px solid var(--outline);

    color: var(--on-surface);

    font-weight: 600;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast {

    position: fixed;

    left: 50%;

    bottom:
        calc(var(--bottom-height) + 20px);

    transform:
        translate(-50%, 20px);

    z-index: 300;

    padding: 12px 18px;

    border-radius: 18px;

    background: #25262B;

    color: white;

    font-size: 13px;

    opacity: 0;

    pointer-events: none;

    transition: .25s ease;
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   LOADER
   ========================================================= */

.loader {

    width: 24px;
    height: 24px;

    border-radius: 50%;

    border: 3px solid var(--primary-container);

    border-top-color: var(--primary);

    animation: spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 800px) {

    :root {
        --header-height: 76px;
    }

    .app-main {
        padding-left: 28px;
        padding-right: 28px;
    }

    .bottom-nav {

        left: 50%;
        right: auto;
        bottom: 18px;

        width: min(600px, calc(100% - 32px));

        height: 76px;

        transform: translateX(-50%);

        border: 1px solid var(--outline);

        border-radius: 28px;

        box-shadow: var(--shadow-soft);

        padding: 0;

    }

    .bottom-inner {
        height: 76px;
    }

    .fab {
        bottom: 110px;
        right: max(30px, calc((100vw - 1200px) / 2 + 30px));
    }

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 360px) {

    .app-main {
        padding-left: 12px;
        padding-right: 12px;
    }

    .material-card {
        padding: 14px;
    }

    .card-icon {
        width: 40px;
        height: 40px;
    }

    .nav-item {
        font-size: 10px;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     LOGIN SCREEN
     ========================================================= -->

<section id="login-screen">

    <div class="login-card">

        <img
            src="assets/name.png"
            class="login-logo"
            alt="COREBIQ">

        <h1>Welcome to COREBIQ</h1>

        <p>
            Your business management workspace.
            Sign in to continue.
        </p>

        <button
            class="google-login"
            id="google-login">

            <span
                class="material-symbols-rounded">
                account_circle
            </span>

            Continue with Google

        </button>

    </div>

</section>


<!-- =========================================================
     MAIN APP
     ========================================================= -->

<div id="app" style="display:none;">


    <!-- HEADER -->

    <header class="app-header">

        <div class="header-left">

            <img
                src="assets/name.png"
                class="brand-logo"
                alt="COREBIQ">

            <span
                class="header-title"
                id="header-title">
                Dashboard
            </span>

        </div>


        <div class="header-spacer"></div>


        <button
            class="header-action"
            onclick="showToast('Notifications coming soon')">

            <span class="material-symbols-rounded">
                notifications
            </span>

        </button>


        <button
            class="header-user"
            id="header-user"
            onclick="showProfile()">

            U

        </button>

    </header>


    <!-- MAIN -->

    <main class="app-main">

        <div
            id="module-container"
            class="module-container">

        </div>

    </main>


    <!-- FAB -->

    <button
        class="fab"
        id="global-fab"
        onclick="globalAction()">

        <span class="material-symbols-rounded">
            add
        </span>

    </button>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <div class="bottom-inner">


            <button
                class="nav-item active"
                data-module="dashboard"
                onclick="loadModule('dashboard')">

                <span class="nav-icon-wrap">

                    <span class="material-symbols-rounded">
                        home
                    </span>

                </span>

                Home

            </button>


            <button
                class="nav-item"
                data-module="clients"
                onclick="loadModule('clients')">

                <span class="nav-icon-wrap">

                    <span class="material-symbols-rounded">
                        groups
                    </span>

                </span>

                Clients

            </button>


            <button
                class="nav-item"
                data-module="contacts"
                onclick="loadModule('contacts')">

                <span class="nav-icon-wrap">

                    <span class="material-symbols-rounded">
                        contacts
                    </span>

                </span>

                Contacts

            </button>


            <button
                class="nav-item"
                data-module="more"
                onclick="loadModule('more')">

                <span class="nav-icon-wrap">

                    <span class="material-symbols-rounded">
                        apps
                    </span>

                </span>

                More

            </button>


        </div>

    </nav>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast">
</div>


<!-- =========================================================
     FIREBASE + APP
     ========================================================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    orderBy,
    limit
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

import {
    firebaseConfig
} from "./firebase.config.js";


/* =========================================================
   FIREBASE INITIALIZATION
   ========================================================= */

const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);

const db =
    getFirestore(firebaseApp);

const provider =
    new GoogleAuthProvider();


/* =========================================================
   GLOBAL APP STATE
   ========================================================= */

window.COREBIQ = {

    firebaseApp,

    auth,

    db,

    user: null,

    currentModule: "dashboard"

};


/* =========================================================
   DOM
   ========================================================= */

const app =
    document.getElementById("app");

const loginScreen =
    document.getElementById("login-screen");

const moduleContainer =
    document.getElementById("module-container");

const headerTitle =
    document.getElementById("header-title");

const headerUser =
    document.getElementById("header-user");


/* =========================================================
   GOOGLE LOGIN
   ========================================================= */

document
    .getElementById("google-login")
    .addEventListener("click", async () => {

        try {

            await signInWithPopup(
                auth,
                provider
            );

        } catch (error) {

            console.error(error);

            showToast(
                error.message ||
                "Unable to sign in"
            );

        }

    });


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(
    auth,
    user => {

        if (user) {

            COREBIQ.user = user;

            loginScreen.style.display =
                "none";

            app.style.display =
                "flex";

            updateUserUI();

            loadModule("dashboard");

        } else {

            COREBIQ.user = null;

            app.style.display =
                "none";

            loginScreen.style.display =
                "flex";

        }

    }
);


/* =========================================================
   USER UI
   ========================================================= */

function updateUserUI() {

    const user =
        COREBIQ.user;

    if (!user) return;

    const name =
        user.displayName ||
        user.email ||
        "User";

    headerUser.textContent =
        name.charAt(0).toUpperCase();

}


/* =========================================================
   MODULE SYSTEM
   ========================================================= */

window.loadModule =
async function(moduleName) {

    COREBIQ.currentModule =
        moduleName;


    /* Navigation */

    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.module === moduleName
            );

        });


    /* Header */

    const titles = {

        dashboard: "Dashboard",
        clients: "Clients",
        contacts: "Contacts",
        more: "More"

    };

    headerTitle.textContent =
        titles[moduleName] ||
        "COREBIQ";


    /* Render */

    moduleContainer.innerHTML = "";

    moduleContainer.style.animation =
        "none";

    void moduleContainer.offsetWidth;

    moduleContainer.style.animation =
        "moduleIn .22s ease";


    switch (moduleName) {

        case "dashboard":

            renderDashboard();

            break;


        case "clients":

            renderClients();

            break;


        case "contacts":

            renderContacts();

            break;


        case "more":

            renderMore();

            break;


        default:

            renderDashboard();

    }

};

/* =========================================================
   CLIENT DATA
   ========================================================= */

let cachedClients = [];


async function loadClients() {

    const list =
        document.getElementById(
            "clients-list"
        );

    if (!COREBIQ.user) return;


    try {

        /*
         Expected Firestore structure:

         clients/{clientId}

         {
            name,
            mobile,
            email,
            businessName,
            tenantId,
            createdAt
         }

         Add your tenant/domain security
         rules before production.
        */


        const q =
            query(
                collection(db, "clients"),
                limit(100)
            );


        const snapshot =
            await getDocs(q);


        cachedClients =
            snapshot.docs.map(
                doc => ({
                    id: doc.id,
                    ...doc.data()
                })
            );


        renderClientList(
            cachedClients
        );


    } catch (error) {

        console.error(error);

        list.innerHTML = `

            <div class="material-card">

                <div class="empty-state">

                    <div class="empty-icon">

                        <span
                            class="material-symbols-rounded">
                            cloud_off
                        </span>

                    </div>

                    <h3>
                        Unable to load clients
                    </h3>

                    <p>
                        Check your Firebase configuration
                        and Firestore permissions.
                    </p>

                </div>

            </div>
        `;

    }

}


function renderClientList(clients) {

    const list =
        document.getElementById(
            "clients-list"
        );

    if (!clients.length) {

        list.innerHTML = `

            <div class="material-card">

                <div class="empty-state">

                    <div class="empty-icon">

                        <span
                            class="material-symbols-rounded">
                            person_add
                        </span>

                    </div>

                    <h3>
                        No clients yet
                    </h3>

                    <p>
                        Add your first client using
                        the + button.
                    </p>

                    <button
                        class="btn btn-primary"
                        onclick="globalAction()">

                        <span
                            class="material-symbols-rounded">
                            add
                        </span>

                        Add Client

                    </button>

                </div>

            </div>
        `;

        return;
    }


    list.innerHTML =
        clients.map(client => {

            const name =
                client.name ||
                client.businessName ||
                "Unnamed Client";

            const mobile =
                client.mobile ||
                client.phone ||
                "No mobile number";

            const initial =
                name
                    .trim()
                    .charAt(0)
                    .toUpperCase();


            return `

                <div class="list-item">

                    <div class="avatar">
                        ${escapeHtml(initial)}
                    </div>

                    <div class="list-content">

                        <div class="list-title">
                            ${escapeHtml(name)}
                        </div>

                        <div class="list-subtitle">
                            ${escapeHtml(mobile)}
                        </div>

                    </div>

                    <button
                        class="list-action"
                        onclick="showToast('Client: ${escapeHtml(name)}')">

                        <span
                            class="material-symbols-rounded">
                            chevron_right
                        </span>

                    </button>

                </div>

            `;

        }).join("");

}


function filterClients(event) {

    const value =
        event.target.value
            .toLowerCase()
            .trim();


    const filtered =
        cachedClients.filter(client => {

            const text =
                [
                    client.name,
                    client.businessName,
                    client.mobile,
                    client.email
                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

            return text.includes(value);

        });


    renderClientList(filtered);

}

/* =========================================================
   TOAST
   ========================================================= */

window.showToast =
function(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.__toastTimer
    );


    window.__toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

};


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}
