<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COREBIQ - Company Overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>
<body>

<div class="module-container" id="company-module">
    
    <style>
    /* --- Core Theme Variables --- */
    :root {
        --primary: #2563EB;
        --bg: #F8FAFC;
        --surface: #FFFFFF;
        --text-main: #0F172A;
        --text-muted: #64748B;
        --border: #E2E8F0;
        --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

        #company-module { font-family: 'Inter', sans-serif; width: 100%; max-width: 850px; margin: 0 auto; } 

        /* --- UI Components --- */
        #company-module .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        #company-module .icon-btn { background: var(--surface); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; box-shadow: var(--shadow-sm); transition: 0.2s; }
        #company-module .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
        
        #company-module .form-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        #company-module .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        #company-module .input-group { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
        @media (min-width: 768px) { #company-module .input-group { grid-template-columns: 1fr 1fr; } }

        #company-module .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; color: var(--text-main); background: #FAFAFA; outline: none; transition: border 0.2s; appearance: auto; }
        
        /* --- Read-Only vs Editable States --- */
        #company-module .readonly-input { background: transparent; border: 1px dashed transparent; padding-left: 0; font-weight: 600; color: var(--text-main); pointer-events: none; transition: all 0.3s ease; }
        #company-module .readonly-input.editable { background: #FAFAFA; border: 1px solid var(--border); padding-left: 16px; pointer-events: auto; font-weight: 500;}
        #company-module .readonly-input.editable:focus { border-color: var(--primary); background: var(--surface); }

        #company-module .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        #company-module .btn-primary:active { opacity: 0.8; }
        #company-module .btn-primary:disabled { background: var(--border); cursor: not-allowed; }
        #company-module .section-header { color: var(--primary); margin-top: 24px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 14px; font-weight: 700; text-transform: uppercase;}
        
        /* --- Image Upload Styles --- */
        .image-upload-wrapper { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
        .image-preview { width: 100px; height: 100px; border-radius: 12px; border: 1px dashed var(--border); background: #FAFAFA; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .image-preview img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .image-preview.has-image img { display: block; }
        .image-preview.has-image .placeholder-icon { display: none; }
        .image-upload-wrapper input[type="file"] { display: none; }
        .upload-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-main); transition: 0.2s; display: none;}
        .readonly-input.editable ~ .upload-btn { display: inline-block; }
        .upload-btn:hover { border-color: var(--primary); color: var(--primary); }

        .horizontal-preview { width: 200px; height: 60px; }
    </style>

    <div class="section-title">
        <h2>Company Overview</h2>
        <button type="button" class="icon-btn" id="editCompanyBtn" onclick="window.toggleEditMode()" title="Edit Details">
            <span class="material-symbols-rounded" style="font-size: 18px;">edit</span>
        </button>
    </div>

    <div class="form-card">
        <form id="company-overview-form">
            <div class="section-header" style="margin-top: 0;">Brand Assets</div>
            <div class="input-group">
                <div class="image-upload-wrapper">
                    <label class="form-label">1x1 Logo (Square)</label>
                    <div class="image-preview" id="logoSquarePreview">
                        <span class="material-symbols-rounded placeholder-icon" style="color: var(--border); font-size: 32px;">image</span>
                        <img id="logoSquareImg" src="" alt="Square Logo">
                    </div>
                    <label class="upload-btn">
                        Upload Image
                        <input type="file" id="compLogoSquare" accept="image/*" class="readonly-input" disabled onchange="previewImage(this, 'logoSquareImg', 'logoSquarePreview')">
                    </label>
                    <input type="hidden" id="compLogoSquareUrl">
                </div>
                
                <div class="image-upload-wrapper">
                    <label class="form-label">Horizontal Logo (Name)</label>
                    <div class="image-preview horizontal-preview" id="logoHorizontalPreview">
                        <span class="material-symbols-rounded placeholder-icon" style="color: var(--border); font-size: 32px;">image</span>
                        <img id="logoHorizontalImg" src="" alt="Horizontal Logo">
                    </div>
                    <label class="upload-btn">
                        Upload Image
                        <input type="file" id="compLogoHorizontal" accept="image/*" class="readonly-input" disabled onchange="previewImage(this, 'logoHorizontalImg', 'logoHorizontalPreview')">
                    </label>
                     <input type="hidden" id="compLogoHorizontalUrl">
                </div>
            </div>

            <div class="section-header">General Information</div>
            <div class="input-group">
                <div>
                    <label class="form-label">Company Name</label>
                    <input type="text" id="compName" class="form-input readonly-input" value="Company Name" readonly>
                </div>
                <div>
                    <label class="form-label">Tagline</label>
                    <input type="text" id="compTagline" class="form-input readonly-input" value="Rebuild Your Health" readonly>
                </div>
                <div style="grid-column: 1 / -1;">
                    <label class="form-label">Address</label>
                    <textarea id="compAddress" class="form-input readonly-input" rows="2" readonly placeholder="Enter full registered address...">Building Name, Floor,Road, Area, Dist, State, Country, Pin,  </textarea>
                </div>
                <div style="grid-column: 1 / -1;">
                    <label class="form-label">Branches</label>
                    <input type="text" id="compBranches" class="form-input readonly-input" value="India| UAE" readonly>
                </div>
            </div>

            <div class="section-header">Contact Details</div>
            <div class="input-group">
                <div>
                    <label class="form-label">Primary Contact No</label>
                    <input type="tel" id="compPhone1" class="form-input readonly-input" value="+91 9895 000 000" readonly>
                </div>
                <div>
                    <label class="form-label">Secondary Contact No</label>
                    <input type="tel" id="compPhone2" class="form-input readonly-input" value="+91 9895 000 111" readonly>
                </div>
                <div>
                    <label class="form-label">Email Address</label>
                    <input type="email" id="compEmail" class="form-input readonly-input" value="support@cmfilings.com" readonly>
                </div>
                <div>
                    <label class="form-label">Website</label>
                    <input type="text" id="compWebsite" class="form-input readonly-input" value="www.yourdomain.com" readonly>
                </div>
            </div>

            <div class="section-header">Bank Details</div>
            <div class="input-group">
                <div>
                    <label class="form-label">Account Name</label>
                    <input type="text" id="compAccName" class="form-input readonly-input" value="Brand Name" readonly>
                </div>
                <div>
                    <label class="form-label">Account Number</label>
                    <input type="text" id="compAccNo" class="form-input readonly-input" value="1234567890" readonly>
                </div>
                <div>
                    <label class="form-label">IFSC Code</label>
                    <input type="text" id="compIfsc" class="form-input readonly-input" value="HDFC000111" readonly>
                </div>
                <div>
                    <label class="form-label">UPI / Mobile</label>
                    <input type="text" id="compUpi" class="form-input readonly-input" value="upiid@hdfc" readonly>
                </div>
            </div>

            <div id="save-actions" style="display: none; margin-top: 32px; text-align: right;">
                <button type="button" id="saveCompanyBtn" class="btn-primary" onclick="window.saveCompanyDetails()">Save Changes</button>
            </div>
        </form>
    </div>

    <script type="module">

    import { db } from "./firebase-config.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    // NOTE: Import Firebase Storage functions if you want to actually upload files to Firebase Storage.
    // This example uses Base64 strings for simplicity/demonstration within Firestore.
    // import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    const companyDocRef = doc(db, "settings", "company_profile");

    // Helper for image preview
    window.previewImage = function(input, imgId, previewContainerId) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            
            reader.onload = function(e) {
                document.getElementById(imgId).src = e.target.result;
                document.getElementById(previewContainerId).classList.add('has-image');
                // Store base64 in hidden input for easy saving to Firestore
                document.getElementById(input.id + 'Url').value = e.target.result; 
            }
            
            reader.readAsDataURL(input.files[0]);
        }
    }


    // --- 1. LOAD DATA ON MOUNT ---
    window.loadCompanyData = async function() {

        try {

            const docSnap = await getDoc(companyDocRef);

            if (docSnap.exists()) {

                const data = docSnap.data();

                if (data.name) document.getElementById('compName').value = data.name;
                if (data.tagline) document.getElementById('compTagline').value = data.tagline;
                if (data.address) document.getElementById('compAddress').value = data.address;
                if (data.branches) document.getElementById('compBranches').value = data.branches;
                if (data.phone1) document.getElementById('compPhone1').value = data.phone1;
                if (data.phone2) document.getElementById('compPhone2').value = data.phone2;
                // Using explicit instruction to update email
                if (data.email) document.getElementById('compEmail').value = data.email; 
                if (data.website) document.getElementById('compWebsite').value = data.website;
                if (data.accName) document.getElementById('compAccName').value = data.accName;
                if (data.accNo) document.getElementById('compAccNo').value = data.accNo;
                if (data.ifsc) document.getElementById('compIfsc').value = data.ifsc;
                if (data.upi) document.getElementById('compUpi').value = data.upi;
                
                // Load Images
                if(data.logoSquare) {
                     document.getElementById('logoSquareImg').src = data.logoSquare;
                     document.getElementById('logoSquarePreview').classList.add('has-image');
                     document.getElementById('compLogoSquareUrl').value = data.logoSquare;
                }
                if(data.logoHorizontal) {
                     document.getElementById('logoHorizontalImg').src = data.logoHorizontal;
                     document.getElementById('logoHorizontalPreview').classList.add('has-image');
                     document.getElementById('compLogoHorizontalUrl').value = data.logoHorizontal;
                }
            } else {
                 // Set default email from instructions if doc doesn't exist
                 document.getElementById('compEmail').value = "support@cmfilings.com";
            }

        } catch (error) {
            console.error("Error fetching company details:", error);
        }

        // Admin access
        if (window.currentUser && window.currentUser.role !== 'admin') {
            const editBtn = document.getElementById('editCompanyBtn');
            if (editBtn) editBtn.style.display = 'none';
        }
    };

    window.loadCompanyData();


    // --- 2. TOGGLE EDIT MODE ---

    window.toggleEditMode = function() {
        const textInputs = document.querySelectorAll('#company-overview-form .readonly-input:not([type="file"])');
        const fileInputs = document.querySelectorAll('#company-overview-form input[type="file"]');
        const saveActions = document.getElementById('save-actions');

        let isEditing = false;

        textInputs.forEach(input => {
            input.classList.toggle('editable');
            if (input.hasAttribute('readonly')) {
                input.removeAttribute('readonly');
                isEditing = true;
            } else {
                input.setAttribute('readonly', true);
            }
        });

        // Handle file inputs separately (disabled instead of readonly)
        fileInputs.forEach(input => {
            input.classList.toggle('editable');
            if(input.hasAttribute('disabled')) {
                input.removeAttribute('disabled');
            } else {
                input.setAttribute('disabled', true);
            }
        });

        saveActions.style.display = isEditing ? 'block' : 'none';
    };


    // --- 3. SAVE DATA TO FIREBASE ---

    window.saveCompanyDetails = async function() {

        const btn = document.getElementById('saveCompanyBtn');
        btn.innerText = "Saving...";
        btn.disabled = true;

        const payload = {
            name: document.getElementById('compName').value,
            tagline: document.getElementById('compTagline').value,
            address: document.getElementById('compAddress').value,
            branches: document.getElementById('compBranches').value,
            phone1: document.getElementById('compPhone1').value,
            phone2: document.getElementById('compPhone2').value,
            email: document.getElementById('compEmail').value,
            website: document.getElementById('compWebsite').value,
            accName: document.getElementById('compAccName').value,
            accNo: document.getElementById('compAccNo').value,
            ifsc: document.getElementById('compIfsc').value,
            upi: document.getElementById('compUpi').value,
            logoSquare: document.getElementById('compLogoSquareUrl').value,
            logoHorizontal: document.getElementById('compLogoHorizontalUrl').value,
            updatedAt: new Date()
        };

        try {
            await setDoc(companyDocRef, payload, { merge: true });
            alert("Company details updated successfully!");
            window.toggleEditMode();
        } catch (error) {
            console.error("Firebase Save Error:", error);
            alert("Failed to save changes. Please check your connection or database rules.");
        }

        btn.innerText = "Save Changes";
        btn.disabled = false;
    };

</script>
</div>

</body>
</html>
