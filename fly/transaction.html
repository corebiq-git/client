<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COREBIQ | Transactions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>
<body>

<div class="module-container" id="transaction-module">
    
   <style>
/* ============================================================
   COREBIQ — GEMINI / MATERIAL 3 TRANSACTIONS
   CSS ONLY — HTML & JS UNCHANGED
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

:root {
    /* Material 3 / Gemini inspired */
    --primary: #0B57D0;
    --primary-dark: #0842A0;
    --primary-light: #E8F0FE;
    --primary-container: #D3E3FD;

    --bg: #F8F9FA;
    --surface: #FFFFFF;
    --surface-container: #F1F3F4;
    --surface-container-low: #F8F9FA;
    --surface-container-high: #E8EAED;

    --text-main: #1F1F1F;
    --text-muted: #5F6368;
    --text-soft: #80868B;

    --border: #DADCE0;
    --border-light: #E8EAED;
    --grey-med: #DADCE0;

    --success: #188038;
    --success-container: #E6F4EA;

    --danger: #D93025;
    --danger-container: #FCE8E6;

    --secondary: #5F6368;

    --shadow-sm:
        0 1px 2px rgba(60,64,67,.08),
        0 2px 6px rgba(60,64,67,.06);

    --shadow-md:
        0 2px 6px rgba(60,64,67,.10),
        0 8px 24px rgba(60,64,67,.08);

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
}

/* ============================================================
   BASE
   ============================================================ */

#transaction-module {
    font-family: 'Outfit', sans-serif;
    width: 100%;
    max-width: 1120px;
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
}

#transaction-module *,
#transaction-module *::before,
#transaction-module *::after {
    box-sizing: border-box;
}

/* ============================================================
   SECTION TITLE
   ============================================================ */

#transaction-module .section-title {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 20px;
    color: var(--text-main);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#transaction-module .section-title h2 {
    font-size: 22px !important;
    font-weight: 600 !important;
    letter-spacing: -0.3px;
}

/* ============================================================
   FORM CARD
   ============================================================ */

#transaction-module .form-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 28px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    margin-bottom: 24px;
}

/* Log Transaction heading */
#transaction-module .form-card h4 {
    color: var(--primary) !important;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.1px;
    border-bottom-color: var(--border-light) !important;
}

/* ============================================================
   FORM LABEL
   ============================================================ */

#transaction-module .form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: none;
    margin-bottom: 7px;
    letter-spacing: 0;
}

/* ============================================================
   INPUT GROUP
   ============================================================ */

#transaction-module .input-group {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    margin-bottom: 18px;
}

@media (min-width: 768px) {
    #transaction-module .input-group {
        grid-template-columns: 1fr 1fr;
    }
}

@media (min-width: 1024px) {
    #transaction-module .input-group.three-cols {
        grid-template-columns: 1fr 1fr 1fr;
    }
}

/* ============================================================
   MATERIAL 3 TEXT FIELDS
   ============================================================ */

#transaction-module .form-input {
    width: 100%;
    min-height: 50px;
    padding: 13px 16px;

    border-radius: 12px;
    border: 1px solid var(--border);

    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 400;

    color: var(--text-main);
    background: var(--surface);

    outline: none;
    appearance: auto;

    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

#transaction-module .form-input:hover {
    border-color: #9AA0A6;
}

#transaction-module .form-input:focus {
    border-color: var(--primary);
    background: var(--surface);

    box-shadow:
        0 0 0 1px var(--primary);
}

#transaction-module .form-input::placeholder {
    color: #9AA0A6;
    opacity: 1;
}

#transaction-module .form-input:disabled {
    background: var(--surface-container);
    color: #9AA0A6;
    cursor: not-allowed;
    border-color: var(--border-light);
}

/* Date / select controls */
#transaction-module input[type="date"],
#transaction-module select {
    cursor: pointer;
}

/* ============================================================
   READONLY FIELD
   ============================================================ */

#transaction-module .readonly-input {
    background: var(--primary-light);
    border: 1px solid transparent;
    padding-left: 16px;
    font-weight: 600;
    color: var(--primary);
    pointer-events: none;
}

/* ============================================================
   PRIMARY BUTTON
   ============================================================ */

#transaction-module .btn-primary {
    min-height: 48px;

    background: var(--primary);
    color: #FFFFFF;

    border: none;
    padding: 0 24px;

    border-radius: 999px;

    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    box-shadow: none;

    transition:
        background .18s ease,
        box-shadow .18s ease,
        transform .12s ease;
}

#transaction-module .btn-primary:hover {
    background: var(--primary-dark);
    box-shadow: var(--shadow-sm);
}

#transaction-module .btn-primary:active {
    transform: scale(.98);
    box-shadow: none;
}

#transaction-module .btn-primary:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* ============================================================
   OUTLINE / SECONDARY BUTTON
   ============================================================ */

#transaction-module .btn-outline {
    min-height: 42px;

    background: transparent;
    color: var(--primary);

    border: 1px solid var(--border);

    padding: 0 17px;
    border-radius: 999px;

    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;

    cursor: pointer;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    transition:
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

#transaction-module .btn-outline:hover {
    background: var(--primary-light);
    border-color: #A8C7FA;
}

#transaction-module .btn-outline:active {
    background: var(--primary-container);
}

/* ============================================================
   VERIFY BUTTON
   ============================================================ */

#transaction-module .btn-verify {
    min-height: 50px;

    background: var(--primary);
    color: #FFFFFF;

    border: none;
    padding: 0 20px;

    border-radius: 999px;

    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .18s ease,
        transform .12s ease;
}

#transaction-module .btn-verify:hover {
    background: var(--primary-dark);
}

#transaction-module .btn-verify:active {
    transform: scale(.97);
}

/* ============================================================
   CUSTOMER SUMMARY
   ============================================================ */

#CUSTOMERSummaryDash {
    display: none;

    background: var(--primary-light);
    border: 1px solid #C5D7F5;

    padding: 18px 20px;

    border-radius: var(--radius-md);

    margin-bottom: 18px;

    align-items: center;
    justify-content: space-between;

    flex-wrap: wrap;
    gap: 20px;
}

#transaction-module .summary-metric {
    display: flex;
    flex-direction: column;
    min-width: 150px;
}

#transaction-module .summary-metric span {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);

    text-transform: none;
    letter-spacing: 0;

    margin-bottom: 5px;
}

#transaction-module .summary-metric strong {
    font-size: 19px;
    font-weight: 600;
    color: var(--text-main);
}

/* ============================================================
   AMOUNT AREA
   ============================================================ */

#transaction-module .input-group[style*="background"] {
    background: var(--surface-container-low) !important;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md) !important;
    padding: 18px !important;
}

#transaction-module input[style*="color: var(--success)"] {
    color: var(--success) !important;
    font-weight: 600 !important;
}

#transaction-module input[style*="color: var(--danger)"] {
    color: var(--danger) !important;
    font-weight: 600 !important;
}

/* ============================================================
   TABLE CONTAINER
   ============================================================ */

#transaction-module .table-container {
    background: var(--surface);

    border-radius: var(--radius-lg);

    box-shadow: var(--shadow-sm);

    border: 1px solid var(--border-light);

    overflow: hidden;

    margin-bottom: 24px;
}

/* ============================================================
   TABLE HEADER
   ============================================================ */

#transaction-module .table-header {
    padding: 20px;

    border-bottom: 1px solid var(--border-light);

    display: flex;
    flex-direction: column;
    gap: 16px;
}

#transaction-module .table-header h4 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    color: var(--text-main);
}

/* ============================================================
   FILTER BAR
   ============================================================ */

#transaction-module .table-header .no-print[style*="background"] {
    background: var(--surface-container-low) !important;

    border: 1px solid var(--border-light) !important;

    border-radius: 14px !important;

    padding: 10px !important;
}

/* Filter inputs */
#transaction-module .table-header .form-input {
    min-height: 40px;
    height: 40px;

    border-radius: 999px;

    font-size: 12px;
    padding: 8px 13px;

    background: var(--surface);
}

/* Search field */
#transaction-module #txnSearchInput {
    font-family: 'Outfit', sans-serif;
    color: var(--text-main);
}

#transaction-module #txnSearchInput::placeholder {
    color: #9AA0A6;
}

/* Search wrapper */
#transaction-module #txnSearchInput {
    min-height: 34px;
}

/* ============================================================
   TABLE
   ============================================================ */

#transaction-module .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

#transaction-module .saas-table {
    width: 100%;
    min-width: 900px;

    border-collapse: separate;
    border-spacing: 0;

    text-align: left;
}

#transaction-module .saas-table th {
    padding: 13px 16px;

    font-size: 11px;
    font-weight: 600;

    color: var(--text-muted);

    text-transform: none;

    background: var(--surface-container-low);

    border-bottom: 1px solid var(--border-light);

    white-space: nowrap;

    letter-spacing: .1px;
}

#transaction-module .saas-table td {
    padding: 15px 16px;

    font-size: 13px;
    font-weight: 400;

    color: var(--text-main);

    border-bottom: 1px solid var(--border-light);

    vertical-align: middle;

    white-space: nowrap;
}

#transaction-module .saas-table tbody tr {
    transition: background .15s ease;
}

#transaction-module .saas-table tbody tr:hover {
    background: #F8FAFF;
}

#transaction-module .saas-table tbody tr:last-child td {
    border-bottom: none;
}

/* ============================================================
   BADGES — MATERIAL TONAL
   ============================================================ */

#transaction-module .badge {
    padding: 5px 10px;

    border-radius: 999px;

    font-size: 11px;
    font-weight: 600;

    text-transform: none;

    display: inline-flex;
    align-items: center;

    line-height: 1;
}

#transaction-module .badge-sales {
    background: var(--success-container);
    color: var(--success);
}

#transaction-module .badge-expense {
    background: var(--danger-container);
    color: var(--danger);
}

#transaction-module .badge-receipt {
    background: var(--surface-container);
    color: var(--secondary);
}

/* ============================================================
   ACTION ICON BUTTON
   ============================================================ */

#transaction-module .cta-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    background: transparent;

    border: none;

    transition:
        background .18s ease,
        transform .12s ease;
}

#transaction-module .cta-link:hover {
    background: var(--surface-container);
    transform: none;
    box-shadow: none;
}

#transaction-module .cta-link .material-symbols-rounded {
    font-size: 18px !important;
}

/* ============================================================
   MATERIAL SYMBOLS
   ============================================================ */

#transaction-module .material-symbols-rounded {
    font-family: 'Material Symbols Rounded';
    font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
}

/* ============================================================
   INLINE ACTION ICONS
   ============================================================ */

#transaction-module .saas-table td .material-symbols-rounded {
    border-radius: 50%;
    padding: 7px;

    transition:
        background .18s ease,
        transform .12s ease;
}

#transaction-module .saas-table td .material-symbols-rounded:hover {
    background: var(--surface-container);
    transform: scale(1.05);
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 767px) {

    #transaction-module {
        width: 100%;
    }

    #transaction-module .section-title {
        margin-bottom: 16px;
    }

    #transaction-module .section-title h2 {
        font-size: 20px !important;
    }

    #transaction-module .form-card {
        padding: 18px;
        border-radius: 18px;
    }

    #transaction-module .input-group {
        gap: 15px;
        margin-bottom: 15px;
    }

    #transaction-module .form-input {
        min-height: 48px;
        font-size: 14px;
    }

    #transaction-module .btn-primary {
        min-height: 46px;
        padding: 0 20px;
    }

    #transaction-module .btn-outline {
        min-height: 44px;
    }

    #transaction-module .btn-verify {
        min-height: 48px;
        padding: 0 17px;
    }

    #CUSTOMERSummaryDash {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
    }

    #transaction-module .table-container {
        border-radius: 18px;
    }

    #transaction-module .table-header {
        padding: 16px;
    }

    #transaction-module .table-header > div:first-child {
        gap: 10px;
    }

    #transaction-module .table-header .no-print[style*="background"] {
        padding: 10px !important;
    }

    #transaction-module .table-header .no-print[style*="background"] > div {
        width: 100%;
    }

    #transaction-module .table-header .form-input {
        flex: 1;
        width: 100% !important;
    }
}

/* ============================================================
   PRINT
   ============================================================ */

@media print {

    body {
        background: white;
        padding: 0;
    }

    #sidebar-container,
    #header-container,
    #bottomnav-container,
    .form-card,
    .section-title,
    .no-print {
        display: none !important;
    }

    .main-wrapper {
        flex: 1;
        display: block;
        overflow: visible;
    }

    #main-content {
        padding: 0;
        overflow: visible;
    }

    #transaction-module .table-container {
        box-shadow: none;
        border: none;
        margin: 0;
    }

    #transaction-module .saas-table th {
        background: white;
        color: black;
        border-bottom: 1px solid #000;
    }

    #transaction-module .saas-table td {
        border-bottom: 1px solid #E8EAED;
    }
}
</style>

</div>
</body>
</html>
