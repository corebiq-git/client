<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COREBIQ - Internal Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>
<body>

<div class="module-container" id="chat-module">
    
    <style>
        /* --- Core Theme Variables (Gemini Material 3) --- */
        :root {
            --primary: #d96570;
            --primary-dark: #3730A3;
            --primary-light: #EEF2FF;
            --accent: #6366F1;
            --accent-soft: #E0E7FF;
            --bg: #F8FAFF;
            --surface: #FFFFFF;
            --surface-soft: #FAFAFF;
            --text-main: #111827;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 24px rgba(79, 70, 229, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        #chat-module { 
            font-family: 'Outfit', sans-serif; 
            width: 100%; 
            max-width: 1000px;
            margin: 0 auto; 
            padding-bottom: 20px;
            height: calc(100vh - 120px); /* Adjust based on your header/bottom nav */
            min-height: 500px;
            display: flex;
            flex-direction: column;
        } 

        .section-title { 
            font-size: 20px; 
            font-weight: 700; 
            margin-bottom: 20px; 
            color: var(--text-dark); 
            display: flex; 
            align-items: center; 
            gap: 10px;
            flex-shrink: 0;
        }

        /* --- Chat Layout --- */
        .chat-wrapper {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0; /* Important for flex child scrolling */
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            position: relative;
        }

        /* --- Sidebar (Contacts) --- */
        .chat-sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--surface-soft);
            flex-shrink: 0;
            transition: 0.3s transform ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .contact-item:hover {
            background: var(--surface);
            border-color: var(--border);
        }

        .contact-item.active {
            background: var(--primary-light);
            border-color: var(--accent-soft);
        }

        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-role {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* --- Main Chat Area --- */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            min-width: 0;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
        }

        .back-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 4px;
            margin-left: -8px;
        }

        .chat-header-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
        }

        .chat-header-info p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 2px 0 0 0;
        }

        /* --- Messages Area --- */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg);
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .message-wrapper.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .sent .message-bubble {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .received .message-bubble {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* --- Chat Input --- */
        .chat-input-area {
            padding: 16px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            outline: none;
            transition: 0.2s ease;
        }

        .chat-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            background: var(--surface);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            background: var(--primary-dark);
            box-shadow: var(--shadow-md);
        }

        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: var(--bg);
        }

        .empty-state .material-symbols-rounded {
            font-size: 48px;
            color: var(--border);
            margin-bottom: 12px;
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .chat-wrapper {
                position: relative;
            }
            .chat-sidebar {
                width: 100%;
                border-right: none;
                position: absolute;
                inset: 0;
                z-index: 10;
            }
            .chat-main {
                display: none;
                width: 100%;
            }
            /* When chat is active */
            .chat-wrapper.chat-active .chat-sidebar {
                display: none;
            }
            .chat-wrapper.chat-active .chat-main {
                display: flex;
            }
            .back-btn {
                display: block;
            }
            .chat-input-area {
                padding: 12px 16px;
            }
        }
    </style>

    <div class="section-title">
        <span class="material-symbols-rounded" style="color: var(--primary);">chat_bubble</span>
        Internal Chat
    </div>

    <div class="chat-wrapper" id="chatWrapper">
        
        <!-- SIDEBAR: CONTACTS -->
        <div class="chat-sidebar" id="chatSidebar">
            <div class="sidebar-header">
                <span class="material-symbols-rounded">forum</span>
                Directory
            </div>
            <div class="contacts-list" id="contactsList">
                <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">
                    Loading users...
                </div>
            </div>
        </div>

        <!-- MAIN: CHAT AREA -->
        <div class="chat-main" id="chatMain">
            
            <!-- Empty State (Shown before selecting a user) -->
            <div class="empty-state" id="chatEmptyState">
                <span class="material-symbols-rounded">chat</span>
                <p style="font-size: 16px; font-weight: 600; color: var(--text-dark);">Your Workspace Messages</p>
                <p style="font-size: 13px;">Select a colleague from the directory to start chatting.</p>
            </div>

            <!-- Active Chat State -->
            <div id="chatActiveState" style="display: none; flex: 1; flex-direction: column; min-height: 0;">
                
                <div class="chat-header">
                    <button class="back-btn" onclick="window.closeMobileChat()">
                        <span class="material-symbols-rounded">arrow_back</span>
                    </button>
                    <div class="contact-avatar" id="activeChatAvatar" style="width: 36px; height: 36px; font-size: 14px;">U</div>
                    <div class="chat-header-info">
                        <h3 id="activeChatName">User Name</h3>
                        <p id="activeChatRole">Role</p>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <!-- Messages populated here -->
                </div>

                <form class="chat-input-area" id="chatForm">
                    <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="send-btn" id="sendBtn" disabled>
                        <span class="material-symbols-rounded" style="margin-left: 4px;">send</span>
                    </button>
                </form>

            </div>
        </div>

    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs, doc, setDoc, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        let allUsers = [];
        let currentChatEmail = null;
        let unsubscribeMessages = null;

        // Ensure we have a logged in user
        const currentUserEmail = (window.currentUser && window.currentUser.email) ? window.currentUser.email.toLowerCase() : null;

        // --- 1. LOAD USERS DIRECTORY ---
        window.loadChatContacts = async function() {
            if (!currentUserEmail) return;

            const listContainer = document.getElementById('contactsList');
            
            try {
                const snap = await getDocs(collection(db, "users"));
                allUsers = [];
                let html = '';

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const email = docSnap.id.toLowerCase();
                    
                    // Don't show yourself in the list
                    if (email !== currentUserEmail) {
                        allUsers.push({ email: email, ...data });
                        
                        const initial = email.charAt(0).toUpperCase();
                        const displayName = email.split('@')[0].replace(/[._]/g, ' ');
                        const role = data.role || 'User';

                        html += `
                            <div class="contact-item" id="contact-${email}" onclick="window.openChat('${email}', '${displayName}', '${role}')">
                                <div class="contact-avatar">${initial}</div>
                                <div class="contact-info">
                                    <div class="contact-name" style="text-transform: capitalize;">${displayName}</div>
                                    <div class="contact-role">${role}</div>
                                </div>
                            </div>
                        `;
                    }
                });

                listContainer.innerHTML = html || '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">No other users found.</div>';
            } catch (err) {
                console.error("Error loading users:", err);
                listContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger); font-size: 13px;">Error loading directory.</div>';
            }
        };

        // --- 2. GENERATE UNIQUE CHAT ID ---
        function getChatId(email1, email2) {
            // Sort alphabetically to ensure both users generate the exact same string
            return [email1, email2].sort().join('_');
        }

        // --- 3. OPEN CHAT & LISTEN TO MESSAGES ---
        window.openChat = function(partnerEmail, displayName, role) {
            if (!currentUserEmail) return;

            currentChatEmail = partnerEmail;

            // UI Updates
            document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
            const activeContact = document.getElementById(`contact-${partnerEmail}`);
            if(activeContact) activeContact.classList.add('active');

            document.getElementById('chatEmptyState').style.display = 'none';
            document.getElementById('chatActiveState').style.display = 'flex';
            
            document.getElementById('activeChatName').innerText = displayName;
            document.getElementById('activeChatRole').innerText = role;
            document.getElementById('activeChatAvatar').innerText = partnerEmail.charAt(0).toUpperCase();
            document.getElementById('activeChatAvatar').style.textTransform = 'capitalize';

            // Mobile toggle
            document.getElementById('chatWrapper').classList.add('chat-active');
            
            // Enable Input
            document.getElementById('messageInput').value = '';
            document.getElementById('sendBtn').disabled = false;

            // Clear previous listener if exists
            if (unsubscribeMessages) {
                unsubscribeMessages();
            }

            // Connect to Firestore Messages
            const chatId = getChatId(currentUserEmail, partnerEmail);
            const messagesRef = collection(db, "chats", chatId, "messages");
            const q = query(messagesRef, orderBy("timestamp", "asc"));

            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12px;">Loading messages...</div>';

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                container.innerHTML = ''; // Clear loading
                
                if (snapshot.empty) {
                    container.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text-muted); font-size:13px;">Start the conversation with ${displayName}!</div>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isSentByMe = data.sender === currentUserEmail;
                    const wrapClass = isSentByMe ? 'sent' : 'received';
                    
                    // Format Time
                    let timeString = '';
                    if (data.timestamp) {
                        const date = data.timestamp.toDate();
                        timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } else {
                        timeString = 'Just now';
                    }

                    const msgHtml = `
                        <div class="message-wrapper ${wrapClass}">
                            <div class="message-bubble">${data.text}</div>
                            <div class="message-time">${timeString}</div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', msgHtml);
                });

                // Auto-scroll to bottom
                container.scrollTop = container.scrollHeight;
            }, (error) => {
                console.error("Error listening to messages:", error);
                container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--danger); font-size:12px;">Error loading messages.</div>';
            });
        };

        // --- 4. SEND MESSAGE ---
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const btn = document.getElementById('sendBtn');
            
            if (!text || !currentChatEmail || !currentUserEmail) return;

            input.value = '';
            btn.disabled = true;

            const chatId = getChatId(currentUserEmail, currentChatEmail);
            const messagesRef = collection(db, "chats", chatId, "messages");

            try {
                // We add the message to the specific chat thread
                await addDoc(messagesRef, {
                    text: text,
                    sender: currentUserEmail,
                    timestamp: serverTimestamp()
                });
                
            } catch (err) {
                console.error("Failed to send message:", err);
                alert("Failed to send message. Please check your connection.");
            } finally {
                btn.disabled = false;
                input.focus();
            }
        });

        // Input validation for button state
        document.getElementById('messageInput').addEventListener('input', function() {
            document.getElementById('sendBtn').disabled = this.value.trim() === '';
        });

        // --- 5. MOBILE BACK NAVIGATION ---
        window.closeMobileChat = function() {
            document.getElementById('chatWrapper').classList.remove('chat-active');
            document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
            currentChatEmail = null;
        };

        // Initialize Module
        if(currentUserEmail) {
            window.loadChatContacts();
        } else {
            document.getElementById('contactsList').innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger); font-size: 13px;">Authentication required.</div>';
        }

    </script>
</div>

</body>
</html>
