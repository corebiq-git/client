<style>
/* =========================================================
   COREBIQ HEADER - PREMIUM WITH DATETIME & NEW LAYOUT
   ========================================================= */
#cb-header {
    width: 100%;
    min-height: 72px;
    box-sizing: border-box;
    background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 55%, #eef2f7 100%);
    border-bottom: 1px solid rgba(148, 163, 184, .15);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 24px;
    position: relative;
    z-index: 900;
    flex-shrink: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    gap: 24px;
}

/* =========================================================
   DATETIME SECTION
   ========================================================= */
.cb-datetime-section {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: max-content;
    padding: 8px 16px;
    background: rgba(255, 255, 255, .5);
    border: 1px solid rgba(203, 213, 225, .4);
    border-radius: 10px;
    backdrop-filter: blur(4px);
}

.cb-datetime-icon {
    font-size: 18px;
    color: #64748b;
}

.cb-datetime-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.cb-date-display {
    font-size: 11px;
    font-weight: 600;
    color: #8b97a8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.cb-time-display {
    font-size: 13px;
    font-weight: 700;
    color: #1e293b;
    letter-spacing: 0.3px;
}

/* =========================================================
   SEARCH BAR - LENGTHY
   ========================================================= */
.cb-search-wrapper {
    flex: 1;
    max-width: 500px;
}

.cb-search-container {
    width: 100%;
    height: 40px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: rgba(255, 255, 255, .7);
    border: 1px solid rgba(203, 213, 225, .4);
    border-radius: 10px;
    transition: .2s ease;
    position: relative;
}

.cb-search-container:hover {
    background: rgba(255, 255, 255, .85);
    border-color: rgba(148, 163, 184, .5);
}

.cb-search-container:focus-within {
    background: rgba(255, 255, 255, 1);
    border-color: rgba(148, 163, 184, .6);
    box-shadow: 0 0 12px rgba(148, 163, 184, .1);
}

.cb-search-icon {
    font-size: 20px;
    color: #94a3b8;
    flex-shrink: 0;
}

.cb-search-input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #1e293b;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.cb-search-input::placeholder {
    color: #cbd5e1;
}

.cb-search-clear {
    display: none;
    width: 28px;
    height: 28px;
    border: 0;
    background: rgba(148, 163, 184, .1);
    border-radius: 6px;
    color: #94a3b8;
    cursor: pointer;
    flex-shrink: 0;
    transition: .2s ease;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

.cb-search-clear:hover {
    background: rgba(148, 163, 184, .2);
    color: #64748b;
}

.cb-search-input:not(:placeholder-shown) ~ .cb-search-clear {
    display: flex;
}

/* =========================================================
   RIGHT ICONS SECTION
   ========================================================= */
.cb-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
}

/* =========================================================
   HEADER ICON BUTTON
   ========================================================= */
.header-icon-btn {
    width: 40px;
    height: 40px;
    border: 1px solid rgba(203, 213, 225, .4);
    background: rgba(255, 255, 255, .6);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    cursor: pointer;
    transition: .2s ease;
    position: relative;
    flex-shrink: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.header-icon-btn:hover {
    background: rgba(255, 255, 255, .8);
    border-color: rgba(148, 163, 184, .5);
    color: #64748b;
}

.header-icon-btn .material-symbols-rounded {
    font-size: 21px;
}

.notification-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f97316;
    border: 1px solid #fff;
    box-shadow: 0 0 8px rgba(249, 115, 22, .4);
}

/* =========================================================
   NOTIFICATION ANIMATION
   ========================================================= */
@keyframes cbRing {
    0%, 50%, 100% { transform: rotate(0); }
    10% { transform: rotate(15deg); }
    20% { transform: rotate(-10deg); }
    30% { transform: rotate(5deg); }
    40% { transform: rotate(-5deg); }
}

.bell-anim {
    animation: cbRing 2s infinite;
    transform-origin: top center;
    color: #94a3b8 !important;
}

.header-icon-btn:hover .bell-anim {
    color: #64748b !important;
}

/* =========================================================
   PROFILE ICON
   ========================================================= */
.cb-profile-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid rgba(203, 213, 225, .5);
    background: rgba(255, 255, 255, .6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: .2s ease;
    flex-shrink: 0;
    color: #94a3b8;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.cb-profile-btn:hover {
    border-color: rgba(148, 163, 184, .6);
    background: rgba(255, 255, 255, .8);
    color: #64748b;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
}

.cb-profile-btn .material-symbols-rounded {
    font-size: 22px;
}

/* =========================================================
   MOBILE MENU BUTTON
   ========================================================= */
.mobile-menu-btn {
    display: none;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(203, 213, 225, .4);
    background: rgba(255, 255, 255, .6);
    border-radius: 9px;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    cursor: pointer;
    transition: .2s ease;
}

.mobile-menu-btn:hover {
    background: rgba(255, 255, 255, .8);
    border-color: rgba(148, 163, 184, .5);
    color: #64748b;
}

.mobile-menu-btn .material-symbols-rounded {
    font-size: 21px;
}

/* =========================================================
   MOBILE SEARCH
   ========================================================= */
.mobile-search-btn {
    display: none;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(203, 213, 225, .4);
    background: rgba(255, 255, 255, .6);
    border-radius: 9px;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    cursor: pointer;
    transition: .2s ease;
}

.mobile-search-btn:hover {
    background: rgba(255, 255, 255, .8);
    border-color: rgba(148, 163, 184, .5);
    color: #64748b;
}

.mobile-search-btn .material-symbols-rounded {
    font-size: 21px;
    color: #94a3b8;
}

.mobile-search-panel {
    display: none;
    position: absolute;
    left: 12px;
    right: 12px;
    top: calc(100% + 8px);
    padding: 8px;
    background: rgba(255, 255, 255, .95);
    border: 1px solid rgba(203, 213, 225, .4);
    border-radius: 11px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    z-index: 9999;
}

.mobile-search-panel.open {
    display: flex;
}

.mobile-search-inner {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 11px;
    box-sizing: border-box;
    background: rgba(255, 255, 255, .8);
    border: 1px solid rgba(203, 213, 225, .4);
    border-radius: 8px;
}

.mobile-search-inner .material-symbols-rounded {
    color: #94a3b8;
    font-size: 20px;
}

.mobile-search-input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #1e293b;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.mobile-search-input::placeholder {
    color: #cbd5e1;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 1024px) {
    #cb-header {
        gap: 16px;
        padding: 0 16px;
    }

    .cb-search-wrapper {
        max-width: 350px;
    }

    .cb-datetime-section {
        padding: 6px 12px;
    }

    .cb-date-display {
        font-size: 10px;
    }

    .cb-time-display {
        font-size: 12px;
    }
}

@media (max-width: 768px) {
    #cb-header {
        gap: 12px;
        min-height: 64px;
        padding: 0 12px;
    }

    .mobile-menu-btn {
        display: flex;
    }

    .cb-datetime-section {
        display: none;
    }

    .cb-search-wrapper {
        flex: 1;
        max-width: none;
        display: none;
    }

    .mobile-search-btn {
        display: flex;
    }

    .header-icon-btn,
    .cb-profile-btn,
    .mobile-search-btn,
    .mobile-menu-btn {
        width: 38px;
        height: 38px;
    }

    .header-icon-btn .material-symbols-rounded,
    .mobile-menu-btn .material-symbols-rounded,
    .mobile-search-btn .material-symbols-rounded {
        font-size: 20px;
    }

    .cb-profile-btn .material-symbols-rounded {
        font-size: 20px;
    }
}

@media (max-width: 480px) {
    #cb-header {
        padding: 0 10px;
        gap: 8px;
    }

    .header-icon-btn,
    .cb-profile-btn,
    .mobile-search-btn,
    .mobile-menu-btn {
        width: 36px;
        height: 36px;
    }
}
</style>

<header id="cb-header">
    <!-- DATETIME SECTION -->
    <div class="cb-datetime-section">
        <span class="material-symbols-rounded cb-datetime-icon">schedule</span>
        <div class="cb-datetime-text">
            <div class="cb-date-display" id="cb-date-display">Sep 26, 2026</div>
            <div class="cb-time-display" id="cb-time-display">12:00:00 AM</div>
        </div>
    </div>

    <!-- SEARCH BAR -->
    <div class="cb-search-wrapper">
        <div class="cb-search-container">
            <span class="material-symbols-rounded cb-search-icon">search</span>
            <input
                type="search"
                class="cb-search-input"
                id="cb-search-input"
                placeholder="Search anything..."
                autocomplete="off">
            <button type="button" class="cb-search-clear" onclick="document.getElementById('cb-search-input').value=''; document.getElementById('cb-search-input').focus();">
                <span class="material-symbols-rounded">close</span>
            </button>
        </div>
    </div>

    <!-- RIGHT ICONS -->
    <div class="cb-header-right">
        <!-- MOBILE MENU BUTTON -->
        <button
            type="button"
            class="mobile-menu-btn"
            onclick="window.toggleMenu()"
            aria-label="Open menu">
            <span class="material-symbols-rounded">menu</span>
        </button>

        <!-- MOBILE SEARCH BUTTON -->
        <button
            type="button"
            class="mobile-search-btn"
            onclick="window.toggleMobileSearch()"
            aria-label="Search">
            <span class="material-symbols-rounded">search</span>
        </button>

        <!-- NOTIFICATION BELL -->
        <button
            type="button"
            class="header-icon-btn"
            title="Notifications"
            onclick="window.handleHeaderNotification?.()">
            <span class="material-symbols-rounded bell-anim">notifications</span>
            <span class="notification-dot"></span>
        </button>

        <!-- PROFILE ICON -->
        <button
            type="button"
            class="cb-profile-btn"
            title="Profile"
            onclick="window.handleProfile?.()">
            <span class="material-symbols-rounded">account_circle</span>
        </button>
    </div>

    <!-- MOBILE SEARCH PANEL -->
    <div class="mobile-search-panel" id="mobile-search-panel">
        <div class="mobile-search-inner">
            <span class="material-symbols-rounded">search</span>
            <input
                type="search"
                class="mobile-search-input"
                id="mobile-header-search"
                placeholder="Search..."
                autocomplete="off">
        </div>
    </div>
</header>

<script>
/* =========================================================
   HEADER COMPONENT FUNCTIONS
   ========================================================= */
(function () {
    /* UPDATE DATETIME */
    window.updateHeaderDateTime = function () {
        const dateDisplay = document.getElementById('cb-date-display');
        const timeDisplay = document.getElementById('cb-time-display');

        if (!dateDisplay || !timeDisplay) return;

        const now = new Date();
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        const dateStr = now.toLocaleDateString('en-US', options);
        const timeStr = now.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        });

        dateDisplay.textContent = dateStr;
        timeDisplay.textContent = timeStr;
    };

    /* INITIALIZE DATETIME AND UPDATE EVERY SECOND */
    window.updateHeaderDateTime();
    setInterval(window.updateHeaderDateTime, 1000);

    /* MOBILE SEARCH */
    window.toggleMobileSearch = function () {
        const panel = document.getElementById('mobile-search-panel');
        if (!panel) return;
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) {
            setTimeout(() => document.getElementById('mobile-header-search')?.focus(), 100);
        }
    };

    /* CLOSE MOBILE SEARCH WHEN CLICKING OUTSIDE */
    document.addEventListener('click', function (event) {
        const panel = document.getElementById('mobile-search-panel');
        const button = document.querySelector('.mobile-search-btn');
        if (panel?.classList.contains('open') && !panel.contains(event.target) && !button?.contains(event.target)) {
            panel.classList.remove('open');
        }
    });

    /* NOTIFICATION HANDLER */
    window.handleHeaderNotification = function () {
        console.log('COREBIQ notifications clicked');
    };

    /* PROFILE HANDLER */
    window.handleProfile = function () {
        console.log('COREBIQ profile clicked');
    };

    /* SEARCH HANDLER */
    const searchInput = document.getElementById('cb-search-input');
    if (searchInput) {
        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                console.log('Search query:', this.value);
                // Add your search logic here
            }
        });
    }
})();
</script>
