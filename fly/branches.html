<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COREBIQ | Branch Management</title>
    <!-- Material 3 Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"/>
</head>
<body>

<div class="module-container" id="branches-module">
    
    <style>
    :root {
        --md-sys-color-primary: #0b57d0;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-primary-container: #d3e3fd;
        --md-sys-color-surface: #f8fafd;
        --md-sys-color-on-surface: #1f1f1f;
        --md-sys-color-surface-container-low: #f3f6fa;
        --md-sys-color-surface-container: #edf1f6;
        --md-sys-color-surface-container-high: #e7ecf1;
        --md-sys-color-surface-container-highest: #e0e5eb;
        --md-sys-color-on-surface-variant: #44474e;
        --md-sys-color-outline: #74777f;
        --md-sys-color-outline-variant: #c4c6d0;
        --md-sys-color-error: #b3261e;
    }

    body {
        background-color: var(--md-sys-color-surface);
        margin: 0;
        padding: 24px;
    }

    #branches-module { 
        font-family: 'Roboto', system-ui, sans-serif; 
        width: 100%; 
        max-width: 1120px; 
        margin: 0 auto; 
        color: var(--md-sys-color-on-surface);
    }

    #branches-module .section-title { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 24px; 
    }

    #branches-module .section-title h2 {
        font-size: 26px;
        font-weight: 500;
        margin: 0;
    }
    
    #branches-module .icon-btn { 
        background: transparent; 
        border: none; 
        width: 40px; 
        height: 40px; 
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        color: var(--md-sys-color-on-surface-variant); 
        cursor: pointer; 
        transition: background-color 0.2s, color 0.2s; 
    }
    #branches-module .icon-btn:hover { 
        background-color: var(--md-sys-color-surface-container-highest); 
        color: var(--md-sys-color-primary); 
    }

    #branches-module .form-card { 
        background: var(--md-sys-color-surface-container-low); 
        border-radius: 24px; 
        padding: 28px; 
        margin-bottom: 28px; 
        width: 100%; 
        box-sizing: border-box;
    }

    #branches-module .form-label { 
        display: block; 
        font-size: 13px; 
        font-weight: 500; 
        color: var(--md-sys-color-on-surface-variant); 
        margin-bottom: 8px; 
    }
    
    #branches-module .input-group { 
        display: grid; 
        grid-template-columns: 1fr; 
        gap: 16px; 
        margin-bottom: 16px; 
    }
    @media (min-width: 768px) { #branches-module .input-group { grid-template-columns: 1fr 1fr; } }
    #branches-module .full-width-field { grid-column: 1 / -1; }

    #branches-module .form-input { 
        width: 100%; 
        box-sizing: border-box;
        padding: 14px 16px; 
        border-radius: 8px; 
        border: 1px solid var(--md-sys-color-outline-variant); 
        font-size: 15px; 
        color: var(--md-sys-color-on-surface); 
        background: transparent; 
        outline: none; 
        font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s; 
    }
    
    #branches-module .readonly-input { 
        border-color: transparent; 
        padding-left: 0; 
        font-weight: 400; 
        pointer-events: none; 
    }
    #branches-module .readonly-input.editable { 
        background: #ffffff; 
        border-color: var(--md-sys-color-outline); 
        padding-left: 16px; 
        pointer-events: auto; 
    }
    #branches-module .readonly-input.editable:focus { 
        border-color: var(--md-sys-color-primary); 
        box-shadow: 0 0 0 1px var(--md-sys-color-primary);
    }
    #branches-module .locked-input { 
        background: var(--md-sys-color-surface-container-highest) !important; 
        color: var(--md-sys-color-on-surface-variant) !important; 
        pointer-events: none !important; 
        border: none !important; 
        padding-left: 16px !important; 
    }

    #branches-module .btn-primary { 
        background: var(--md-sys-color-primary); 
        color: var(--md-sys-color-on-primary); 
        border: none; 
        padding: 10px 22px; 
        border-radius: 100px; 
        font-size: 14px; 
        font-weight: 500; 
        cursor: pointer; 
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background-color 0.2s; 
    }
    #branches-module .btn-primary:hover { 
        background: #115fe4; 
    }
    
    #branches-module .btn-outline { 
        background: transparent; 
        color: var(--md-sys-color-primary); 
        border: 1px solid var(--md-sys-color-outline); 
        padding: 10px 22px; 
        border-radius: 100px; 
        font-size: 14px; 
        font-weight: 500; 
        cursor: pointer; 
        transition: background-color 0.2s;
    }
    #branches-module .btn-outline:hover {
        background: var(--md-sys-color-primary-container);
    }

    #branches-module .table-container { 
        background: var(--md-sys-color-surface-container-low); 
        border-radius: 24px; 
        overflow: hidden; 
        width: 100%; 
    }
    #branches-module .table-header { 
        padding: 20px 24px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        flex-wrap: wrap; 
        gap: 16px;
    }
    #branches-module .table-header h4 { 
        font-size: 18px; 
        font-weight: 500; 
        margin: 0; 
    }
    
    #branches-module .m3-search {
        background: var(--md-sys-color-surface-container-high); 
        border-radius: 100px; 
        padding: 8px 16px; 
        display: flex; 
        align-items: center; 
        gap: 8px;
    }
    #branches-module .m3-search input {
        border: none; 
        background: transparent; 
        outline: none; 
        font-size: 14px; 
        width: 180px;
        color: var(--md-sys-color-on-surface);
        font-family: inherit;
    }
    
    #branches-module .table-responsive { 
        width: 100%; 
        overflow-x: auto; 
    }
    #branches-module .saas-table { 
        width: 100%; 
        min-width: 760px; 
        border-collapse: collapse; 
        text-align: left; 
    }
    #branches-module .saas-table th { 
        padding: 14px 20px; 
        font-size: 13px; 
        font-weight: 500; 
        color: var(--md-sys-color-on-surface-variant); 
        border-bottom: 1px solid var(--md-sys-color-outline-variant); 
    }
    #branches-module .saas-table td { 
        padding: 14px 20px; 
        font-size: 14px; 
        color: var(--md-sys-color-on-surface);
        border-bottom: 1px solid var(--md-sys-color-surface-container-high); 
    }
    #branches-module .saas-table tr:hover td {
        background: var(--md-sys-color-surface-container);
    }
    #branches-module .branch-info { display: flex; flex-direction: column; }
    #branches-module .branch-info .bid { font-size: 12px; color: var(--md-sys-color-primary); font-weight: 700; }
    </style>

    <div class="section-title">
        <h2>Branch Management</h2>
        <button type="button" class="btn-primary" onclick="window.prepareAddBranch()">
            <span class="material-symbols-rounded" style="font-size: 18px;">add</span> Add Branch
        </button>
    </div>

    <div class="form-card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--md-sys-color-outline-variant); padding-bottom: 14px; margin-bottom: 20px;">
            <h4 id="formHeading" style="color: var(--md-sys-color-primary); margin: 0; font-size: 17px; font-weight: 500;">Branch Details</h4>
            
            <button type="button" class="icon-btn" id="editBranchBtnForm" onclick="window.toggleEditMode(true)" title="Edit Branch">
                <span class="material-symbols-rounded">edit</span>
            </button>
        </div>

        <form id="branch-details-form">
            <input type="hidden" id="branchDocId" value="">

            <div class="input-group">
                <div>
                    <label class="form-label">Branch ID</label>
                    <input type="text" id="branchIdDisplay" class="form-input locked-input" value="Auto-Generated" readonly>
                </div>
                <div>
                    <label class="form-label">Branch Name *</label>
                    <input type="text" id="branchName" class="form-input readonly-input" placeholder="e.g. Mahe" readonly required>
                </div>
            </div>
            
            <div class="input-group">
                <div class="full-width-field">
                    <label class="form-label">Complete Address *</label>
                    <textarea id="branchAddress" class="form-input readonly-input" rows="2" placeholder="Full branch address..." readonly required style="resize: vertical;"></textarea>
                </div>
            </div>

            <div class="input-group">
                <div>
                    <label class="form-label">Contact No</label>
                    <input type="tel" id="branchContact" class="form-input readonly-input" placeholder="+91 00000 00000" readonly>
                </div>
                <div>
                    <label class="form-label">Email Address</label>
                    <input type="email" id="branchEmail" class="form-input readonly-input" placeholder="branch@stracares.in" readonly>
                </div>
            </div>

            <div class="input-group">
                <div class="full-width-field">
                    <label class="form-label">Google Navigation Link</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary);">pin_drop</span>
                        <input type="url" id="branchMap" class="form-input readonly-input" placeholder="https://maps.google.com/..." readonly>
                    </div>
                </div>
            </div>

            <div id="save-actions" style="display: none; margin-top: 24px; text-align: right;">
                <button type="button" class="btn-outline" onclick="window.cancelEdit()" style="margin-right: 8px;">Cancel</button>
                <button type="button" class="btn-primary" id="saveBranchBtn" onclick="window.saveBranch()">Save Updates</button>
            </div>
        </form>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h4>Registered Branches</h4>
            <div class="m3-search">
                <span class="material-symbols-rounded" style="font-size: 18px; color: var(--md-sys-color-on-surface-variant);">search</span>
                <input type="text" id="branchSearchInput" onkeyup="window.searchBranches()" placeholder="Search branches...">
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="saas-table">
                <thead>
                    <tr>
                        <th>Branch Name & ID</th>
                        <th>Contact Info</th>
                        <th>Email Address</th>
                        <th>Maps Location</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="branchTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, addDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcO1L2Za7dzILxylmMkRTSx0FBVu_EEoM",
            authDomain: "cmf001stra.firebaseapp.com",
            projectId: "cmf001stra",
            storageBucket: "cmf001stra.firebasestorage.app",
            messagingSenderId: "763958641347",
            appId: "1:763958641347:web:316876bc2340b26bd21876",
            measurementId: "G-770FBR88LJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.branchDataCache = {};

        const canUserEdit = () => {
            return !window.currentUser || window.currentUser.role === 'admin';
        };

        window.toggleEditMode = function(forceEnable) {
            if (forceEnable && !canUserEdit()) {
                alert("Permission denied. Admin role required.");
                return;
            }

            const inputs = document.querySelectorAll('#branch-details-form .readonly-input');
            const saveActions = document.getElementById('save-actions');
            
            let isEditing = forceEnable; 
            if(forceEnable === undefined || forceEnable === null) {
                isEditing = inputs.length > 0 && inputs[0].hasAttribute('readonly'); 
            }
            
            inputs.forEach(input => {
                if(isEditing) {
                    input.classList.add('editable');
                    input.removeAttribute('readonly');
                } else {
                    input.classList.remove('editable');
                    input.setAttribute('readonly', true);
                }
            });

            saveActions.style.display = isEditing ? 'block' : 'none';
        };

        window.prepareAddBranch = function() {
            if (!canUserEdit()) {
                return alert("Only administrators can add branches.");
            }
            document.getElementById('branch-details-form').reset();
            document.getElementById('branchDocId').value = '';
            document.getElementById('branchIdDisplay').value = 'Auto-Generated';
            document.getElementById('formHeading').innerText = 'Create New Branch';
            document.getElementById('saveBranchBtn').innerText = 'Create Branch';
            window.toggleEditMode(true);
            document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            window.toggleEditMode(false);
            document.getElementById('branch-details-form').reset();
            document.getElementById('branchDocId').value = '';
            document.getElementById('branchIdDisplay').value = 'Auto-Generated';
            document.getElementById('formHeading').innerText = 'Branch Details';
            document.getElementById('saveBranchBtn').innerText = 'Save Updates';
        };

        window.searchBranches = function() {
            const input = document.getElementById("branchSearchInput").value.toLowerCase();
            const trs = document.getElementById("branchTableBody").getElementsByTagName("tr");
            
            for (let i = 0; i < trs.length; i++) {
                if (trs[i].cells.length === 1) continue; 
                const text = trs[i].innerText.toLowerCase();
                trs[i].style.display = text.indexOf(input) > -1 ? "" : "none";
            }
        };

        window.loadBranches = async function() {
            const tableBody = document.getElementById('branchTableBody');
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">Loading branches...</td></tr>';

            try {
                const querySnapshot = await getDocs(collection(db, "branches"));
                let branchesList = [];
                window.branchDataCache = {};
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--md-sys-color-on-surface-variant);">No branches registered yet.</td></tr>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    data.docId = docSnap.id;
                    window.branchDataCache[docSnap.id] = data;
                    branchesList.push(data);
                });

                branchesList.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
                tableBody.innerHTML = ''; 

                const isAdmin = canUserEdit();

                branchesList.forEach((data) => {
                    let mapHtml = data.mapLink ? `<a href="${data.mapLink}" target="_blank" style="color: var(--md-sys-color-primary); text-decoration: none; font-weight: 500; font-size: 13px;">View Map</a>` : `<span style="color: var(--md-sys-color-outline); font-size: 13px;">N/A</span>`;
                    let actionHtml = isAdmin 
                        ? `<span class="material-symbols-rounded" style="color: var(--md-sys-color-on-surface-variant); cursor: pointer; font-size: 20px;" title="Edit Branch" onclick="window.editBranch('${data.docId}')">edit</span>`
                        : `<span class="material-symbols-rounded" style="color: var(--md-sys-color-outline-variant); font-size: 20px;">lock</span>`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><div class="branch-info"><span class="bid">${data.branchId || 'B-000'}</span><strong>${data.name || 'Unknown'}</strong></div></td>
                        <td>${data.contact || '--'}</td>
                        <td>${data.email || '--'}</td>
                        <td>${mapHtml}</td>
                        <td>${actionHtml}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                console.error("Firebase Read Error:", error);
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--md-sys-color-error);">Error loading branches.</td></tr>';
            }
        };

        window.loadBranches();

        window.editBranch = function(docId) {
            if (!canUserEdit()) return;

            const data = window.branchDataCache[docId];
            if(!data) return;

            document.getElementById('branchDocId').value = docId;
            document.getElementById('branchIdDisplay').value = data.branchId || '';
            document.getElementById('branchName').value = data.name || '';
            document.getElementById('branchAddress').value = data.address || '';
            document.getElementById('branchContact').value = data.contact || '';
            document.getElementById('branchEmail').value = data.email || '';
            document.getElementById('branchMap').value = data.mapLink || '';

            document.getElementById('formHeading').innerText = 'Edit Branch';
            document.getElementById('saveBranchBtn').innerText = 'Save Updates';

            window.toggleEditMode(true);
            document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
        };

        window.saveBranch = async function() {
            if (!canUserEdit()) return;

            const saveBtn = document.getElementById('saveBranchBtn');
            const docId = document.getElementById('branchDocId').value;
            const name = document.getElementById('branchName').value.trim();
            const address = document.getElementById('branchAddress').value.trim();
            const contact = document.getElementById('branchContact').value.trim();
            const email = document.getElementById('branchEmail').value.trim();
            const mapLink = document.getElementById('branchMap').value.trim();

            if(!name || !address) {
                return alert("Branch Name and Address are required!");
            }

            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            try {
                if (docId) {
                    const payload = {
                        name, address, contact, email, mapLink,
                        updatedAt: new Date()
                    };
                    await updateDoc(doc(db, "branches", docId), payload);
                    alert("Branch updated successfully!");
                } else {
                    const payload = {
                        branchId: "B-" + Math.floor(1000 + Math.random() * 9000),
                        name, address, contact, email, mapLink,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    };
                    await addDoc(collection(db, "branches"), payload);
                    alert("New branch added successfully!");
                }

                window.cancelEdit();
                window.loadBranches();
            } catch (error) {
                console.error("Firebase Save Error:", error);
                alert("Failed to save branch. Check Firestore security rules.");
            }

            saveBtn.disabled = false;
        };
    </script>
</div>

</body>
</html>
