<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4b8fd1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>COREBIQ | Page Not Found</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">

<style>
:root{
  --bg:#f5f9fe;
  --surface:#ffffff;
  --text:#17202b;
  --text-soft:#46515e;
  --muted:#687484;
  --border:#dbe5ef;
  --primary:#4b8fd1;
  --primary-dark:#3476b5;
  --primary-light:#d9edff;
  --shadow:0 8px 28px rgba(45,72,101,.08),0 20px 55px rgba(45,72,101,.055);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Poppins",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%,rgba(75,143,209,.10),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(75,143,209,.08),transparent 32%),
    var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.error-page{
  width:min(680px,100%);
  text-align:center;
}

.logo{
  width:58px;
  height:58px;
  margin:0 auto 22px;
  display:grid;
  place-items:center;
  border:1px solid #cfe3f5;
  border-radius:16px;
  background:#e7f3ff;
  color:var(--primary-dark);
  font-size:21px;
  font-weight:700;
  letter-spacing:-1.5px;
  box-shadow:0 5px 18px rgba(45,72,101,.06);
}

.error-card{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.92);
  border:1px solid var(--border);
  border-radius:22px;
  padding:46px 34px 40px;
  box-shadow:var(--shadow);
}

.error-card:before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border:1px solid rgba(75,143,209,.13);
  border-radius:50%;
  top:-150px;
  right:-90px;
  box-shadow:
    0 0 0 25px rgba(75,143,209,.035),
    0 0 0 52px rgba(75,143,209,.025);
}

.error-icon{
  width:82px;
  height:82px;
  margin:0 auto 23px;
  display:grid;
  place-items:center;
  border:1px solid #cfe3f5;
  border-radius:20px;
  background:#eaf6ff;
  color:var(--primary-dark);
}

.error-icon .material-symbols-rounded{
  font-size:43px;
}

.error-code{
  position:relative;
  font-size:72px;
  line-height:1;
  font-weight:700;
  letter-spacing:-3px;
  color:var(--primary-dark);
  margin-bottom:13px;
}

h1{
  position:relative;
  font-size:25px;
  line-height:1.3;
  font-weight:600;
  color:var(--text);
  margin-bottom:10px;
}

.message{
  position:relative;
  max-width:480px;
  margin:0 auto;
  font-size:13px;
  line-height:1.75;
  color:var(--text-soft);
}

.actions{
  position:relative;
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:27px;
  flex-wrap:wrap;
}

.btn{
  min-height:44px;
  padding:0 20px;
  border-radius:11px;
  border:1px solid var(--border);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  transition:.18s ease;
}

.btn-primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
  box-shadow:0 5px 14px rgba(75,143,209,.20);
}

.btn-primary:hover{
  background:var(--primary-dark);
  border-color:var(--primary-dark);
  transform:translateY(-1px);
}

.btn-secondary{
  background:#fff;
  color:var(--text-soft);
}

.btn-secondary:hover{
  background:#f5f9fe;
}

.material-symbols-rounded{
  font-size:19px;
}

.footer{
  margin-top:17px;
  color:var(--muted);
  font-size:10px;
}

@media(max-width:520px){
  body{padding:16px}
  .error-card{
    padding:36px 21px 30px;
    border-radius:18px;
  }
  .error-code{
    font-size:60px;
  }
  h1{
    font-size:21px;
  }
  .message{
    font-size:12px;
  }
  .actions{
    flex-direction:column;
  }
  .btn{
    width:100%;
  }
}
</style>
</head>

<body>
<main class="error-page" aria-labelledby="error-title">

  <div class="logo" aria-label="COREBIQ">BIQ</div>

  <section class="error-card">

    <div class="error-icon" aria-hidden="true">
      <span class="material-symbols-rounded">search_off</span>
    </div>

    <div class="error-code">404</div>

    <h1 id="error-title">Page not found</h1>

    <p class="message">
      The page you're looking for may have been moved, removed,
      or the address may be incorrect.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="./index.html">
        <span class="material-symbols-rounded">home</span>
        Back to Dashboard
      </a>

      <button class="btn btn-secondary" type="button" onclick="history.back()">
        <span class="material-symbols-rounded">arrow_back</span>
        Go Back
      </button>
    </div>

  </section>

  <div class="footer">COREBIQ • Intelligent Business Workflow</div>

</main>
</body>
</html>
